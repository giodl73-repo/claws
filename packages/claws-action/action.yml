name: 'claws Governance Check'
description: 'Run claws governance checks and upload SARIF to GitHub Code Scanning'
author: 'craftworks'

branding:
  icon: 'shield'
  color: 'blue'

# Required permissions:
#   contents: read              — checkout repository
#   security-events: write      — upload SARIF to GitHub Code Scanning (stages 1, 2, 3)

inputs:
  stage:
    description: 'Pipeline stage: 0 (pre-commit), 1 (PR check), 2 (CD gate), 3 (fleet cron)'
    required: true
  format:
    description: 'Output format: sarif, json, csv, default'
    required: true
    default: 'sarif'
  fail-on:
    description: 'Severity threshold to fail: critical, high, medium, all'
    required: false
    default: 'all'
  warn-only:
    description: 'Report violations without failing the check (exit 0 with warnings)'
    required: false
    default: 'false'
  sign:
    description: 'Sign artifacts during Stage 2 CD gate'
    required: false
    default: 'false'
  framework:
    description: 'Target framework hint (claude-code, cursor, copilot, etc.)'
    required: false
    default: ''
  cache:
    description: 'Enable governance compilation cache'
    required: false
    default: 'true'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file (when format=sarif)'
  violation-count:
    description: 'Total number of governance violations found'
  exit-code:
    description: 'Exit code from claws (0=clean, 1=violations, 2=bypass, 3=error)'
  cache-hit:
    description: 'Whether a cache hit occurred for .claws/ compilation artifacts'

runs:
  using: 'composite'
  steps:
    - name: Compute governance cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      run: |
        KEY=$(${{ github.action_path }}/scripts/cache-key.sh "${{ github.workspace }}")
        echo "key=claws-governance-${KEY}" >> "$GITHUB_OUTPUT"

    - name: Restore .claws/ cache
      id: cache-restore
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: .claws/
        key: ${{ steps.cache-key.outputs.key }}

    - name: Run claws governance check
      shell: bash
      run: ${{ github.action_path }}/scripts/run.sh
      env:
        INPUT_STAGE: ${{ inputs.stage }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_WARN_ONLY: ${{ inputs.warn-only }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_SIGN: ${{ inputs.sign }}
        INPUT_CACHE: ${{ inputs.cache }}
        CLAWS_CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}

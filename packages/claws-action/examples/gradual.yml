# Gradual adoption workflow — 8-week severity gating ramp.
#
# Recommended adoption schedule for existing repositories:
#   Week 1:  warn-only   — observe violations without blocking merges
#   Week 2:  fail-on: critical — block only critical-severity violations
#   Week 4:  fail-on: high     — block critical + high violations
#   Week 8:  fail-on: all      — block all violations (full enforcement)
#
# How to use:
#   1. Start with the "Week 1" job active and the others commented out.
#   2. Each week, uncomment the next enforcement level.
#   3. At week 8, remove the earlier jobs and keep only "Full enforcement".
#
# The Stage 2 CD gate job demonstrates artifact signing for release pipelines.

name: claws Gradual Adoption

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ── Week 1: Observation mode ─────────────────────────────────────────
  # Violations are reported as PR annotations but never block merges.
  # Use this phase to inventory existing governance gaps.
  week-1-observe:
    name: 'Week 1: Warn Only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @bic/claws-cli

      - name: Run claws (warn-only)
        uses: craftworks/claws-action@v1
        with:
          stage: '1'
          format: 'sarif'
          warn-only: 'true'

  # ── Week 2: Block critical only ─────────────────────────────────────
  # Only critical-severity violations (e.g., missing approval gates on
  # dangerous tools) block merges. High/medium/low are still warnings.
  # week-2-critical:
  #   name: 'Week 2: Fail on Critical'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: npm install -g @bic/claws-cli
  #
  #     - name: Run claws (fail-on critical)
  #       uses: craftworks/claws-action@v1
  #       with:
  #         stage: '1'
  #         format: 'sarif'
  #         fail-on: 'critical'

  # ── Week 4: Block critical + high ───────────────────────────────────
  # Medium-severity violations (e.g., missing data classification) remain
  # warnings. Teams should have remediated critical/high by this point.
  # week-4-high:
  #   name: 'Week 4: Fail on High'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: npm install -g @bic/claws-cli
  #
  #     - name: Run claws (fail-on high)
  #       uses: craftworks/claws-action@v1
  #       with:
  #         stage: '1'
  #         format: 'sarif'
  #         fail-on: 'high'

  # ── Week 8: Full enforcement ────────────────────────────────────────
  # All violations block merges. This is the steady-state configuration.
  # week-8-all:
  #   name: 'Week 8: Full Enforcement'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: npm install -g @bic/claws-cli
  #
  #     - name: Run claws (fail-on all)
  #       uses: craftworks/claws-action@v1
  #       with:
  #         stage: '1'
  #         format: 'sarif'
  #         fail-on: 'all'

  # ── Stage 2 CD Gate (optional) ──────────────────────────────────────
  # For release pipelines, use Stage 2 with artifact signing.
  # This job blocks deployment when violations exceed the threshold
  # and signs governance attestation artifacts for supply chain security.
  # cd-gate:
  #   name: 'CD Gate (with signing)'
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: npm install -g @bic/claws-cli
  #
  #     - name: Run claws CD gate
  #       uses: craftworks/claws-action@v1
  #       with:
  #         stage: '2'
  #         format: 'sarif'
  #         fail-on: 'critical'
  #         sign: 'true'

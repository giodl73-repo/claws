# Fleet scan workflow with matrix strategy.
#
# Runs claws governance checks across multiple repositories in parallel.
# Each repository gets its own cache key based on its governance files,
# so changes in one repo do not invalidate another repo's cache.
#
# Prerequisites:
#   - claws must be installed in the runner
#   - FLEET_TOKEN must be a PAT with read access to all target repos
#   - Code Scanning must be enabled on each target repository

name: claws Fleet Scan

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      fail-on:
        description: 'Minimum severity to fail'
        required: false
        default: 'critical'
        type: choice
        options:
          - critical
          - high
          - medium
          - all

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - org/workspace-alpha
          - org/workspace-beta
          - org/workspace-gamma
          # Add more repositories as needed

    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.FLEET_TOKEN }}

      - name: Install claws
        run: npm install -g @bic/claws-cli

      - name: Run claws governance check
        uses: craftworks/claws-action@v1
        with:
          stage: '3'
          format: 'sarif'
          fail-on: ${{ inputs.fail-on || 'critical' }}
          cache: 'true'

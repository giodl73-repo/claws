# Acceptance manifest — Ptah + Anubis CP-1 series
# Ptah: compile, rules, emit, conflicts, pitfalls (74 scenarios)
# Anubis CP-1: gateway enforcement, degraded mode, audit chain, before/after diff

series:
  # ── Phase 1: Ptah (Foundation) ──

  compile-pipeline:
    runners: [compile-sim]
    min: 8
    marker: "scenario.yaml"
    spec: CL-04
    description: "Full compilation pipeline — parse 9 files, extract intents, analyze rules, emit artifacts"

  governance-rules:
    runners: [pinch-sim]
    min: 12
    marker: "scenario.yaml"
    spec: CL-02
    description: "All 29 governance rules — R1-R5 classification, A2A, injection, elicitation, supply chain"

  fail-mode:
    runners: [pinch-sim, security-sim]
    min: 6
    marker: "scenario.yaml"
    spec: CL-02
    description: "FailMode<R> enforcement — R5 always closed, R1-R2 configurable, crash behavior"

  emit-artifacts:
    runners: [emit-sim]
    min: 8
    marker: "scenario.yaml"
    spec: CL-04
    description: "4-artifact emission — Gateway plugin, SKILL.md, exec-approvals, compiled workflow"

  cross-file-conflicts:
    runners: [compile-sim]
    min: 7
    marker: "scenario.yaml"
    spec: CL-04
    description: "7 cross-file conflict categories — DENY-vs-TOOL, TRUST-ESCALATION, OBO-WITHOUT-ELICIT, etc."

  # ── Praetor Integration (Ptah-scoped) ──

  input-resolver:
    runners: [compile-sim]
    min: 6
    marker: "scenario.yaml"
    spec: CL-01, CL-04, CL-07
    description: "InputResolver integration — 9-file default, package governance, URL policies, provenance"

  loss-aware-emission:
    runners: [compile-sim]
    min: 5
    marker: "scenario.yaml"
    spec: CL-04, CL-07
    description: "Loss-aware routing — 7-platform loss matrix, path enumerator, --strict-loss for R5"

  # ── Pitfall Coverage (Ptah-scoped) ──

  pitfall-coverage-1:
    runners: [compile-sim, pinch-sim, emit-sim]
    min: 10
    marker: "scenario.yaml"
    spec: CL-02, CL-04
    description: "Pitfall validation — edge cases from first scenario round (P-051 through P-070)"

  # ── Cross-cutting ──

  lossless-roundtrip:
    runners: [compile-sim]
    min: 5
    marker: "scenario.yaml"
    spec: CL-04
    description: "Round-trip fidelity — parse → IR → emit preserves original workspace byte-for-byte"

  platform-detection:
    runners: [compile-sim]
    min: 7
    marker: "scenario.yaml"
    spec: CL-01
    description: "7-platform detection — OC, Cursor, Claude, GitHub, Bedrock, LangGraph, CrewAI"

  # ── Phase 2: Anubis CP-1 (Gateway Enforcement) ──

  gateway-enforcement:
    runners: [gateway-sim]
    min: 6
    marker: "scenario.yaml"
    spec: CL-02, CL-07
    description: "Runtime enforcement — compile → load plugin → fire tool calls → verify block/allow/elicit per risk tier"

  gateway-degraded:
    runners: [gateway-sim]
    min: 3
    marker: "scenario.yaml"
    spec: CL-02
    description: "Degraded mode — R5 fail-closed when GovernanceHost absent/throws/malformed (P-051)"

  gateway-audit-chain:
    runners: [gateway-sim]
    min: 3
    marker: "scenario.yaml"
    spec: CL-02
    description: "Audit chain integrity — every outcome writes entry, sequential IDs, HMAC chain (P-052)"

  gateway-before-after:
    runners: [gateway-sim]
    min: 2
    marker: "scenario.yaml"
    spec: CL-02, CL-07
    description: "Before/after diff — zero governance vs full governance, SimReport.diff regression detection"

  gateway-pitfalls:
    runners: [gateway-sim]
    min: 5
    marker: "scenario.yaml"
    spec: CL-02, CL-04
    description: "Gateway pitfall validation — P-051 (fail-closed), P-052 (audit all outcomes), P-053 (bypass audit), P-057 (OBO elicit), P-062 (default-deny unknown tools), P-064 (trust escalation)"

name: soc2-deploy
description: SOC2-compliant deployment with parallel branches

steps:
  - name: checkout
    command: git checkout main
  - name: scan-secrets
    command: run secret-scanner
  - name: lint-code
    command: npm run lint
  - name: send-notification
    command: send-email --to ops@example.com --subject "Deploy started"
  - name: run-tests
    command: npm test
  - name: deploy-staging
    command: deploy --env staging
  - name: approval-gate
    command: request-approval --team leads
  - name: deploy-prod
    command: deploy --env production
  - name: audit-log
    command: log deployment-complete

dependencies:
  scan-secrets:
    - checkout
  lint-code:
    - checkout
  send-notification:
    - checkout
  run-tests:
    - scan-secrets
    - lint-code
  deploy-staging:
    - run-tests
  approval-gate:
    - deploy-staging
    - send-notification
  deploy-prod:
    - approval-gate
  audit-log:
    - deploy-prod

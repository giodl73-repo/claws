id: soc2-type-ii
version: "1.0"
framework: SOC 2 Type II
requirements:
  - id: CC6.1
    title: Logical and physical access controls restrict access to system resources
    kind: static
    predicate: has-governance-rules
    description: At least one governance rule must be declared to constrain access.
  - id: CC6.6
    title: System protects against unauthorized access
    kind: static
    predicate: has-deny-rules
    description: SOUL deny-rules must exist to block known-bad tool patterns.
  - id: CC7.2
    title: System monitors components and operation
    kind: structural
    predicate: audit-tamper-seal-present
    description: Audit manifest must carry a tamper seal (hash chain).
  - id: CC8.1
    title: Changes to system are authorised
    kind: static
    predicate: every-r5-has-irreversible-external
    description: R5 tools must declare IRREVERSIBLE_EXTERNAL so change-control triggers.
  - id: A1.2
    title: System availability — audit retention
    kind: structural
    predicate: audit-retention-1-year
    description: Audit log retention must be at least 365 days for Type II observation.

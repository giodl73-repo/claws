name: acceptance

# Pulse 09 L3 gate — fresh-clone `npm ci && npm run build && npm test`
# across Linux + Windows + macOS. A single developer running one platform
# cannot silently green something that fails on another OS; this workflow
# is the tri-platform guard pulse plan §Headlines H3 validation asked for.

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/acceptance.yml'
  push:
    branches: [main, 'feature/**']

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: tsc --noEmit (claws CLI)
        working-directory: packages/claws
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: packages/claws
        run: npx vitest run --project unit

      - name: Integration tests
        working-directory: packages/claws
        run: npx vitest run --project integration

      - name: E2E tests
        working-directory: packages/claws
        run: npx vitest run --project e2e

      - name: L3 acceptance tests
        working-directory: packages/claws
        run: npx vitest run --project accept tests/acceptance/

      - name: Residue-grep gate (CI mode)
        if: runner.os != 'Windows'
        run: bash scripts/residue-grep.sh --mode=ci

      - name: Residue-grep gate (Git Bash on Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/residue-grep.sh --mode=ci

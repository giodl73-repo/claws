name: repo-ops

# CP-8 (Horus wave) — repo-business tooling tests + live gates.
#
# This workflow runs the 4 tool suites landed in Horus CP-8:
#   1. devtools/repo-ops/        — doc-structure / atom-coverage /
#                                  readme-reachability / accept-runner validators
#   2. tools/atoms-oracle/       — 4-way bidirectional oracle sweep
#                                  enforcing CL-13 v1.8 §N.1
#   3. tools/doc-sync/           — index drift detection (specs README
#                                  vs CL-*.md; docs README vs ATOMS.md dirs)
#   4. tools/guide-deploy/       — idempotent wave-guides migration
#                                  driver + broken-link verifier
#
# Tests are HARD gates. Live gates for atoms-oracle + doc-sync are also
# HARD (they run clean against the current tree). repo-ops full-tree
# check.ts and guide-deploy verify-links run INFORMATIONAL because they
# surface ~1,100 pre-existing BLOCK findings in legacy content that
# Horus did not seed (docs/concepts/fleet-*, docs/traces/*,
# docs/proposals/openclaw-upstream/*). Follow-on wave promotes those to
# hard gates once the legacy tree is reconciled.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    paths:
      - 'devtools/repo-ops/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/repo-ops.yml'

jobs:
  # -------------------------------------------------------------------
  # Job 1 — tests (hard gate, matrix for cross-platform validation)
  # -------------------------------------------------------------------
  tests:
    name: tool tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies (for tsx + vitest)
        run: npm ci

      - name: Install devtools/repo-ops dependencies
        working-directory: devtools/repo-ops
        run: npm install

      - name: Build workspace packages (required by some tool tests)
        run: npm run build

      - name: devtools/repo-ops — vitest
        working-directory: devtools/repo-ops
        run: npx vitest run

      - name: tools/atoms-oracle — vitest
        shell: bash
        run: npx vitest run tools/atoms-oracle/

      - name: tools/doc-sync — vitest
        shell: bash
        run: npx vitest run tools/doc-sync/

      - name: tools/guide-deploy — vitest
        shell: bash
        run: npx vitest run tools/guide-deploy/

  # -------------------------------------------------------------------
  # Job 2 — live gates (hard)
  #
  # These validators run against the actual docs/ tree and MUST exit 0.
  # Both are clean against the current state (CP-8 exit): atoms-oracle
  # reports 94 atoms + 0 orphans; verify-indexes reports 0 drift.
  # -------------------------------------------------------------------
  live-gate-hard:
    name: live gate — atoms-oracle + verify-indexes (hard)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: atoms-oracle — 4-way bidirectional sweep
        run: npx tsx tools/atoms-oracle/bidirectional-sweep.ts --docs-dir docs/

      - name: atoms-oracle — evidence sidecar
        run: npx tsx tools/atoms-oracle/emit-evidence.ts --docs-dir docs/ --out .ci/atoms-oracle-evidence.json

      - name: doc-sync — verify indexes
        run: npx tsx tools/doc-sync/verify-indexes.ts --docs-dir docs/

      - name: Upload atoms-oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atoms-oracle-evidence
          path: .ci/atoms-oracle-evidence.json
          retention-days: 14

  # -------------------------------------------------------------------
  # Job 3 — live gates (informational)
  #
  # These validators surface ~1,100 pre-existing BLOCK findings in
  # legacy content (docs/concepts/fleet-*, docs/traces/*,
  # docs/proposals/openclaw-upstream/*, docs/getting-started/tutorial.md,
  # docs/architecture/, etc.) that Horus did not seed. Running them
  # informationally gives visibility on the baseline + proves the
  # tooling itself executes; follow-on wave reconciles legacy and
  # promotes to hard gate.
  # -------------------------------------------------------------------
  live-gate-informational:
    name: live gate — repo-ops + verify-links (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install devtools/repo-ops dependencies
        working-directory: devtools/repo-ops
        run: npm install

      - name: repo-ops check — full docs/ tree (informational)
        id: repo_ops
        continue-on-error: true
        run: |
          set +e
          npx tsx devtools/repo-ops/src/check.ts --docs-dir docs/ \
            > .ci/repo-ops-output.txt 2>&1
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          tail -3 .ci/repo-ops-output.txt
          exit 0

      - name: guide-deploy verify-links — full docs/ tree (informational)
        id: verify_links
        continue-on-error: true
        run: |
          set +e
          mkdir -p .ci
          npx tsx tools/guide-deploy/verify-links.ts --docs-dir docs/ \
            > .ci/verify-links-output.txt 2>&1
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          tail -3 .ci/verify-links-output.txt
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "## repo-ops + verify-links informational baseline"
          echo ""
          echo "repo-ops check exit: ${{ steps.repo_ops.outputs.exit_code }}"
          echo "verify-links exit:   ${{ steps.verify_links.outputs.exit_code }}"
          echo ""
          echo "Both expected non-zero today due to pre-existing legacy"
          echo "content out of Horus scope. Tracked for promotion to hard"
          echo "gate in a follow-on wave once legacy is reconciled."

      - name: Upload informational outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-ops-informational
          path: .ci/
          retention-days: 14

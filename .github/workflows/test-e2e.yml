name: test-e2e

# Pulse 47 L3 acceptance gate — runs the `test:e2e:accept` project
# across ubuntu + windows + macos. Any platform-specific skip must be
# documented in a fixture's `fixture.yaml` with a `skipOn:` + reason.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'test/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-e2e.yml'
  push:
    branches: [main, 'feature/**']

jobs:
  e2e-accept:
    name: e2e accept (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: tsc --noEmit (test/e2e)
        shell: bash
        run: npx tsc --noEmit -p test/e2e/tsconfig.json

      - name: e2e unit tests
        run: npm run test:e2e:unit

      - name: e2e integration tests
        run: npm run test:e2e:integration

      - name: e2e scenario tests
        run: npm run test:e2e:e2e

      - name: e2e L3 acceptance tests
        run: npm run test:e2e:accept

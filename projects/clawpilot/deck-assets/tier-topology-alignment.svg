<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="80" y="72" font-family="Segoe UI, Arial" font-size="36" font-weight="900" fill="#0f172a">Capability Tiers Meet Runtime Topology</text>
  <text x="80" y="112" font-family="Segoe UI, Arial" font-size="23" fill="#475569">Left: what the backend can do. Right: where that work runs and who enforces the boundary.</text>

  <text x="160" y="175" font-family="Segoe UI, Arial" font-size="30" font-weight="900" fill="#111827">Capability tier model</text>
  <text x="1010" y="175" font-family="Segoe UI, Arial" font-size="30" font-weight="900" fill="#111827">Runtime topology model</text>

  <rect x="90" y="220" width="500" height="120" rx="20" fill="#fff3dd" stroke="#8a5a12" stroke-width="4" filter="url(#shadow)"/>
  <text x="132" y="268" font-family="Segoe UI, Arial" font-size="31" font-weight="900" fill="#63400e">Operator</text>
  <text x="132" y="306" font-family="Segoe UI, Arial" font-size="22" fill="#63400e">Remote/operator work, chat/activity parity, cloud-routed agent tasks.</text>

  <rect x="90" y="390" width="500" height="120" rx="20" fill="#e7efff" stroke="#1f4f99" stroke-width="4" filter="url(#shadow)"/>
  <text x="132" y="438" font-family="Segoe UI, Arial" font-size="31" font-weight="900" fill="#183c76">Node</text>
  <text x="132" y="476" font-family="Segoe UI, Arial" font-size="22" fill="#183c76">Local execution capabilities: files, shell, browser, clipboard, apps.</text>

  <rect x="90" y="560" width="500" height="120" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="4" filter="url(#shadow)"/>
  <text x="132" y="608" font-family="Segoe UI, Arial" font-size="31" font-weight="900" fill="#334155">Beyond</text>
  <text x="132" y="646" font-family="Segoe UI, Arial" font-size="22" fill="#334155">No durable primitive yet; gate off or define a new capability contract.</text>

  <rect x="980" y="210" width="500" height="126" rx="20" fill="#fff3dd" stroke="#8a5a12" stroke-width="4" filter="url(#shadow)"/>
  <text x="1022" y="258" font-family="Segoe UI, Arial" font-size="30" font-weight="900" fill="#63400e">0-N hosted OpenClaw agents</text>
  <text x="1022" y="296" font-family="Segoe UI, Arial" font-size="22" fill="#63400e">Optional cloud capacity selected per session, turn, or task.</text>

  <rect x="980" y="385" width="500" height="126" rx="20" fill="#e7efff" stroke="#1f4f99" stroke-width="4" filter="url(#shadow)"/>
  <text x="1022" y="433" font-family="Segoe UI, Arial" font-size="30" font-weight="900" fill="#183c76">Scout Desktop runtime</text>
  <text x="1022" y="471" font-family="Segoe UI, Arial" font-size="22" fill="#183c76">Local UX, local tools, local approvals, local evidence.</text>

  <rect x="980" y="560" width="500" height="126" rx="20" fill="#e4f6fb" stroke="#1f6f8b" stroke-width="4" filter="url(#shadow)"/>
  <text x="1022" y="608" font-family="Segoe UI, Arial" font-size="30" font-weight="900" fill="#15536a">Cloud tether / control plane</text>
  <text x="1022" y="646" font-family="Segoe UI, Arial" font-size="22" fill="#15536a">Identity, tenant policy, routing, audit, entitlements, rollout controls.</text>

  <line x1="590" y1="280" x2="980" y2="274" stroke="#8a5a12" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="675" y="257" font-family="Segoe UI, Arial" font-size="22" font-weight="800" fill="#63400e">usually hosted agent work</text>

  <line x1="590" y1="450" x2="980" y2="448" stroke="#1f4f99" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="684" y="427" font-family="Segoe UI, Arial" font-size="22" font-weight="800" fill="#183c76">local execution boundary</text>

  <path d="M590 620 C740 700, 830 708, 980 630" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow)"/>
  <text x="690" y="717" font-family="Segoe UI, Arial" font-size="22" font-weight="800" fill="#334155">needs new primitive or explicit gate</text>

  <path d="M1230 560 C1230 520, 1230 515, 1230 511" fill="none" stroke="#1f6f8b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <path d="M1230 560 C1230 480, 1230 410, 1230 336" fill="none" stroke="#1f6f8b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="1260" y="530" font-family="Segoe UI, Arial" font-size="21" font-weight="800" fill="#15536a">tether governs both paths</text>

  <rect x="160" y="760" width="1280" height="62" rx="16" fill="#ffffff" stroke="#ccd5e2" stroke-width="2"/>
  <text x="214" y="800" font-family="Segoe UI, Arial" font-size="26" font-weight="900" fill="#223047">Use tiers to decide capability readiness. Use topology to decide routing, enforcement, degraded modes, and audit ownership.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="760" fill="#f7f9fc"/>

  <rect x="70" y="50" width="1260" height="116" rx="18" fill="#efe8ff" stroke="#7141a4" stroke-width="3"/>
  <text x="110" y="100" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#4d2478">Lobster managed cloud substrate</text>
  <text x="110" y="140" font-family="Segoe UI, Arial" font-size="24" fill="#4d2478">tenant policy · admin overrides · rollout · kill switches · audit taxonomy</text>

  <rect x="70" y="210" width="1260" height="116" rx="18" fill="#e4f6fb" stroke="#1f6f8b" stroke-width="3"/>
  <text x="110" y="260" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#15536a">Cloud tether / control plane</text>
  <text x="110" y="300" font-family="Segoe UI, Arial" font-size="24" fill="#15536a">identity · entitlements · policy sync · config · routing · session linkage · audit correlation</text>

  <rect x="150" y="430" width="420" height="170" rx="18" fill="#fff3dd" stroke="#8a5a12" stroke-width="3" filter="url(#shadow)"/>
  <text x="190" y="482" font-family="Segoe UI, Arial" font-size="32" font-weight="800" fill="#63400e">Hosted OpenClaw agents</text>
  <text x="190" y="525" font-family="Segoe UI, Arial" font-size="24" fill="#63400e">AI agent loops · cloud tools · MCP</text>
  <text x="190" y="562" font-family="Segoe UI, Arial" font-size="24" fill="#63400e">operator · co-create · long-running tasks</text>

  <rect x="830" y="430" width="420" height="170" rx="18" fill="#e7efff" stroke="#1f4f99" stroke-width="3" filter="url(#shadow)"/>
  <text x="870" y="482" font-family="Segoe UI, Arial" font-size="32" font-weight="800" fill="#183c76">Scout Desktop runtime</text>
  <text x="870" y="525" font-family="Segoe UI, Arial" font-size="24" fill="#183c76">local UI · approvals · local context</text>
  <text x="870" y="562" font-family="Segoe UI, Arial" font-size="24" fill="#183c76">files · shell · browser · clipboard</text>

  <line x1="700" y1="326" x2="360" y2="430" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="326" x2="1040" y2="430" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="570" y1="515" x2="830" y2="515" stroke="#4b5563" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
  <text x="622" y="494" font-family="Segoe UI, Arial" font-size="20" fill="#4b5563">local capability request</text>

  <rect x="310" y="660" width="780" height="58" rx="14" fill="#ffffff" stroke="#ccd5e2" stroke-width="2"/>
  <text x="365" y="697" font-family="Segoe UI, Arial" font-size="28" font-weight="800" fill="#223047">Cloud alignment does not require hosted execution for every turn.</text>

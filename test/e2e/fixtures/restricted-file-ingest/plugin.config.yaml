version: 1
peer: FileIngestProvider
classifier:
  # Any file whose name matches the pattern is classified RESTRICTED; the
  # host surfaces this via `AuthorizationContext.effectiveSensitivity`
  # when `before_workspace_file_ingest` fires.
  rules:
    - match: '**/SECRETS.md'
      classification: RESTRICTED
    - match: '**/*'
      classification: PUBLIC
stage:
  root: .openclaw/.stage
review:
  requireApproval: true
  ttlMs: 300000

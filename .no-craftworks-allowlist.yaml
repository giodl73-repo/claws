# .no-craftworks-allowlist.yaml
#
# Authoritative allowlist for the zero-craftworks-sweep residue scanner.
# Each entry exempts a path glob from the sweep's `@craftworks/*` and
# bare-`craftworks` detection, with a written justification + reviewer
# signature.
#
# Schema (enforced by tools/migration/allowlist-validator.ts):
#   - path:        glob relative to claws repo root
#   - reason:      ≥ 20 chars, explains WHY the path is exempt
#   - approvedBy:  signature of the reviewer who authorised the entry
#
# Exemption categories (for reviewer clarity):
#   A. Historical wave directories — Ptah, Anubis, Thoth, Ra-the-Radiant
#      waves predate the lift; their files are preserved for git-blame
#      continuity (plan §Notes + REPLAN.md).
#   B. Migration-prose plans under .craft/plans/** — these files describe
#      the craftworks→claws migration itself and reference the old
#      scope as context, not as live imports.
#   C. Design-era docs — docs/specs, docs/concepts, docs/scenarios, etc.
#      Written before the lift; reference craftworks as the origin repo.
#   D. Negative-grep infrastructure — test files, eslint configs, and
#      src-level scanners whose entire purpose is to detect and reject
#      `@craftworks/*` patterns. Removing the literal would defeat the
#      check. These are the sweep's older siblings.
#   E. Attribution / mailmap — preserved by filter-repo for author
#      history continuity.
#
# Unreviewed additions to this file fail pulse 08's CI check; every
# change must arrive with reason + approvedBy.

entries:
  # ── Self — the allowlist itself ───────────────────────────────────────
  - path: ".no-craftworks-allowlist.yaml"
    reason: "this file is the allowlist; reason fields necessarily name the craftworks pattern"
    approvedBy: "clawc-repo-steward"

  # ── A. Historical wave directories ────────────────────────────────────
  - path: ".craft/waves/**"
    reason: "historical wave directories preserved for git-blame continuity (ptah, anubis, thoth, ra)"
    approvedBy: "clawc-repo-steward"

  # ── B. Migration-prose plans ──────────────────────────────────────────
  - path: ".craft/plans/**"
    reason: "plan prose describes the craftworks→claws migration itself; refs are context not imports"
    approvedBy: "clawc-repo-steward"

  - path: ".craft/roles/**"
    reason: "role definitions reference craftworks origin for provenance context"
    approvedBy: "clawc-repo-steward"


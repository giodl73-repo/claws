name: S44-violation-state-transitions
series: cap-integration
version: 2
specs: [CL-10, CL-06, CL-08, CL-12]
description: >
  Full state machine test exercising every violation state transition:
  CLEAN -> DEGRADED_R5 -> CLEAN -> DEGRADED_WARN -> ERROR -> CLEAN. Each
  transition is triggered by a different cause. Verifies state persistence
  across restart, SSE events for each transition, chunk governance metadata
  per state, and PATCH behavior per state.

expect:
  state_machine:
    transitions:
      - from: CLEAN
        to: DEGRADED_R5
        trigger: r5_tool_violation
      - from: DEGRADED_R5
        to: CLEAN
        trigger: admin_fix_recompile
      - from: CLEAN
        to: DEGRADED_WARN
        trigger: g_data_violation
      - from: DEGRADED_WARN
        to: ERROR
        trigger: structural_parse_failure
      - from: ERROR
        to: CLEAN
        trigger: file_fix_recompile
  persistence:
    file: ".claws/cache/violation-state.json"
    survives_restart: true
  sse_events:
    one_per_transition: true
    includes_from_and_to_state: true
  chunks:
    governance_metadata_per_state: true
  patch_behavior:
    CLEAN: allowed
    DEGRADED_R5: blocked_for_violating_tool
    DEGRADED_WARN: allowed_with_warnings
    ERROR: 503_all

simulate:
  failures:
    - type: r5_tool_violation
      during: "transition 1"
    - type: g_data_violation
      during: "transition 3"
    - type: structural_parse_failure
      during: "transition 4"
  halt: null
  budget: null

problem: >
  A comprehensive state machine exercise. Starting from CLEAN, an OC runtime
  installs a tool with R5 violation -> DEGRADED_R5. Admin fixes the tool ->
  CLEAN. Then OC runtime writes CONFIDENTIAL data to MEMORY.md without audit
  trail -> DEGRADED_WARN. While in DEGRADED_WARN, a VS Code save corrupts
  SOUL.md -> ERROR (structural error takes precedence). Admin fixes SOUL.md ->
  recompile succeeds, MEMORY.md warning resolved too -> CLEAN. Throughout, the
  violation state is persisted to .claws/cache/violation-state.json so a
  restart recovers the correct state. SSE events are emitted for every
  transition. Chunks served at each state include appropriate governance
  metadata. PATCH behavior differs per state: allowed in CLEAN, per-tool
  blocked in DEGRADED_R5, allowed-with-warnings in DEGRADED_WARN, 503 in
  ERROR.

findings:
  - id: F01
    severity: critical
    description: >
      The violation state must be persisted to
      .claws/cache/violation-state.json. The file must contain: current
      state, list of active violations (each with type, file, tool if
      applicable, timestamp), and the last transition timestamp. The file
      must be written atomically (write to temp, rename) to prevent
      corruption. On restart, the system reads this file and restores the
      state. If the file is missing, the system assumes CLEAN and performs
      a full recompile to verify. If the file is corrupted, the system
      logs a warning, assumes CLEAN, and recompiles.
    spec_impact: "CL-06 state persistence — .claws/cache/violation-state.json; atomic writes; CLEAN + recompile on missing/corrupt"
    pitfall: null

  - id: F02
    severity: critical
    description: >
      On restart, the persisted state must be validated against the actual
      workspace. If violation-state.json says DEGRADED_R5 but the violating
      tool has been removed from TOOLS.md (e.g., by an external edit during
      downtime), the state must not blindly restore to DEGRADED_R5. The
      startup recompile must re-evaluate all violations and reconcile the
      persisted state. The final state after restart is determined by the
      recompile result, not the persisted file alone. The persisted file
      is a hint for the recovery report, not an authoritative state source.
    spec_impact: "CL-06 restart reconciliation — recompile determines actual state; persisted state is hint only; reconcile on startup"
    pitfall: null

  - id: F03
    severity: critical
    description: >
      When concurrent violations exist (e.g., R5 violation on a tool AND
      structural error in SOUL.md), the worst state wins. The severity
      order is: CLEAN < DEGRADED_WARN < DEGRADED_R5 < ERROR. ERROR is
      worst because it means the compiler cannot produce valid IR. If an
      R5 violation and a structural error coexist, the system is in ERROR
      (not DEGRADED_R5) because the structural error prevents compilation.
      When the structural error is fixed, the system must re-evaluate and
      may transition to DEGRADED_R5 (the R5 violation persists).
    spec_impact: "CL-10 concurrent violations — worst state wins; ERROR > DEGRADED_R5 > DEGRADED_WARN > CLEAN; re-evaluate on partial fix"
    pitfall: null

  - id: F04
    severity: critical
    description: >
      SSE events must be emitted for every state transition, including
      the from-state and to-state. The event type is
      "governance:state_changed" with payload {from, to, trigger, violations,
      timestamp}. Partners use these events to maintain their own state
      mirrors. If a transition is missed (e.g., DEGRADED_R5 -> CLEAN is
      not emitted), the partner's state mirror is permanently out of sync.
      The SSE event must be emitted AFTER the state file is persisted, so
      that if the server crashes immediately after the event, the persisted
      state matches what was broadcast.
    spec_impact: "CL-10 SSE state events — governance:state_changed with from/to/trigger; emitted after persistence"
    pitfall: null

  - id: F05
    severity: critical
    description: >
      The DEGRADED_WARN to ERROR transition (caused by structural error
      while already degraded) must preserve the DEGRADED_WARN violations
      in the violation list. When the structural error is fixed and the
      system recompiles, it must re-evaluate the DEGRADED_WARN conditions.
      If the G-DATA violation still exists, the system transitions from
      ERROR to DEGRADED_WARN (not CLEAN). The transition is not always
      ERROR -> CLEAN; it is ERROR -> whatever the recompile result says.
    spec_impact: "CL-10 ERROR recovery — re-evaluate all violations; may transition to DEGRADED not CLEAN; preserve violation list through ERROR"
    pitfall: null

  - id: F06
    severity: major
    description: >
      The status endpoint (GET /api/status) must reflect the current state
      with full detail per state. In CLEAN: {state: "CLEAN",
      violations: [], last_compilation: "..."}. In DEGRADED_R5: {state:
      "DEGRADED_R5", violations: [{type, tool, file}], blocked_tools: [...]}.
      In DEGRADED_WARN: {state: "DEGRADED_WARN", warnings: [{type, file,
      recommended_action}]}. In ERROR: {state: "ERROR", errors: [{file,
      line, column, message}], last_good_compilation: "..."}. A generic
      {state: "DEGRADED"} without details is insufficient.
    spec_impact: "CL-10 status endpoint — state-specific detail schema; violations, warnings, errors with full context"
    pitfall: null

  - id: F07
    severity: major
    description: >
      Chunks must include governance metadata appropriate to the current
      state. In CLEAN: {governance: {state: "CLEAN"}}. In DEGRADED_R5:
      {governance: {state: "DEGRADED_R5", violations: [...],
      blocked_tools: [...]}}. In DEGRADED_WARN: {governance: {state:
      "DEGRADED_WARN", warnings: [...]}}. In ERROR: {governance: {state:
      "ERROR", stale: true, last_good_compilation: "..."}}. The governance
      metadata is per-chunk (not per-request) because different chunks may
      have different violation relevance. A chunk for a non-blocked tool
      in DEGRADED_R5 should still include the state but indicate that this
      specific chunk is unaffected.
    spec_impact: "CL-10 chunk governance — state-specific metadata per chunk; relevance indicator for per-tool states"
    pitfall: null

  - id: F08
    severity: major
    description: >
      PATCH behavior must differ per state and be documented in a single
      decision matrix. CLEAN: 200 (allowed). DEGRADED_R5: 403 for
      blocked tool, 200 for others. DEGRADED_WARN: 200 with warnings
      array. ERROR: 503 for all PATCHes. The decision must be made by a
      single middleware function that checks the current state and the
      target resource. If PATCH behavior is scattered across route
      handlers, inconsistencies will emerge (e.g., one handler blocks in
      DEGRADED_WARN, another allows).
    spec_impact: "CL-10 PATCH matrix — single middleware; CLEAN=200, DEGRADED_R5=403/200, DEGRADED_WARN=200+warn, ERROR=503"
    pitfall: null

  - id: F09
    severity: major
    description: >
      Degraded state timeout (auto-resolve) should NOT exist for
      DEGRADED_R5. An R5 violation requires explicit human action to
      resolve — it cannot auto-resolve because the violating tool is
      still present. DEGRADED_WARN could potentially auto-resolve if the
      warning condition is transient, but G-DATA violations are not
      transient. ERROR auto-resolves when the file is fixed (detected by
      file watcher). The system must never silently transition from
      DEGRADED to CLEAN without a recompile that proves the violation is
      gone.
    spec_impact: "CL-10 no auto-resolve — DEGRADED_R5 requires human fix; DEGRADED_WARN requires config fix; only ERROR auto-resolves on file fix"
    pitfall: null

  - id: F10
    severity: major
    description: >
      The violation count should be tracked in the status endpoint as a
      running total: total_violations (lifetime), active_violations
      (current), resolved_violations (cleared). This gives the admin
      visibility into whether violations are a recurring pattern (high
      total, low active) or an accumulating problem (high active). The
      count must be persisted alongside the state in
      violation-state.json and survive restarts.
    spec_impact: "CL-10 violation counts — total/active/resolved in status and persisted state; trend visibility"
    pitfall: null

  - id: F11
    severity: major
    description: >
      Fleet admin notification must be triggered on DEGRADED_R5 (but not
      on DEGRADED_WARN or ERROR). DEGRADED_R5 means a tool is blocked,
      which may affect the agent's ability to perform its role in the
      fleet. The fleet controller needs to know so it can reassign work.
      DEGRADED_WARN does not affect capability. ERROR is typically
      transient (fixed by editing the file). The notification should
      include the workspace ID, the blocked tools, and the violation
      details.
    spec_impact: "CL-08 fleet notification — on DEGRADED_R5 only; includes workspace ID, blocked tools, violation details"
    pitfall: null

  - id: F12
    severity: warning
    description: >
      The state transition history should be available via
      GET /api/status/history with the last N transitions (e.g., 50).
      Each entry includes: from_state, to_state, trigger, timestamp,
      and violations at that point. This allows the admin to see the
      full sequence of events without parsing audit logs. The history
      is a ring buffer in memory, backed by the persisted state file's
      transition_log array.
    spec_impact: "CL-10 transition history — GET /api/status/history; ring buffer; last 50 transitions with full detail"
    pitfall: null

  - id: F13
    severity: warning
    description: >
      The state machine must be tested with rapid transitions (e.g.,
      CLEAN -> DEGRADED_R5 -> CLEAN within 100ms). If the state
      persistence is asynchronous and the system transitions faster than
      the file can be written, the persisted state may lag behind the
      actual state. On restart, the stale persisted state is restored.
      The write must be synchronous (blocking the transition until
      persistence completes) or the startup reconciliation must handle
      stale states gracefully by always recompiling.
    spec_impact: "CL-06 rapid transitions — state persistence must not lag; synchronous write or startup reconciliation"
    pitfall: null

  - id: F14
    severity: note
    description: >
      A visualization of the state machine should be available at
      GET /api/status/state-machine as a DOT graph or JSON adjacency
      list. This helps partners and admins understand the possible
      transitions, their triggers, and the current position. The
      current state should be highlighted. This is a developer
      experience improvement — not critical for safety but valuable
      for onboarding and debugging.
    spec_impact: "CL-10 state machine visualization — GET /api/status/state-machine; DOT or JSON; current state highlighted"
    pitfall: null

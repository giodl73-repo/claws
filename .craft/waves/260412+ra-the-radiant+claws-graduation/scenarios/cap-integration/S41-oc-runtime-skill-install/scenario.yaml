name: S41-oc-runtime-skill-install
series: cap-integration
version: 2
specs: [CL-10, CL-12, CL-06, CL-14]
description: >
  Validates behavior when the OC runtime installs a skill with R5 tools by
  directly writing to the workspace (bypassing the API). The file watcher
  detects the change, an auto-snapshot captures pre-install state, and
  recompilation classifies a tool as R5 with no elicitation gate. The system
  enters DEGRADED_R5 state, blocking the specific R5 tool while all other
  tools continue to function. An admin can diff the auto-snapshot against
  current state, fix the violation, and restore CLEAN status.

expect:
  auto_snapshot:
    trigger: before_recompile
    captures: full_oc_state
    labeled: "auto:pre-install"
  violation_detection:
    type: R5_MISSING_ELICITATION
    attributed_to: oc_runtime
    degraded_state: DEGRADED_R5
  tool_blocking:
    granularity: per_tool
    r5_tool_block.source: "r5"
    other_tools_operational: true
    workspace_not_lock.source: "r5"
  admin_diff:
    endpoint: "GET /api/diff?from=auto:previous&to=current"
    shows_oc_changes: true
  resolution:
    admin_fixes_violation: true
    recompile_clears_state: true
    final_state: CLEAN

simulate:
  failures:
    - type: oc_runtime_write
      target: TOOLS.md
      content: "skill with R5 tool missing elicitation gate"
  halt: null
  budget: null

problem: >
  An agent's OC runtime installs a new skill by directly writing to TOOLS.md
  in the workspace. The skill includes a tool "deploy-to-prod" that operates
  on behalf of the user (OBO pattern) but has no elicitation gate configured.
  The file watcher detects the write, and the system must: (1) capture an
  auto-snapshot of the workspace state before recompilation, (2) recompile
  and detect the R5 violation (OBO without elicitation), (3) enter DEGRADED_R5
  state, (4) block only the "deploy-to-prod" tool while leaving all other
  tools operational, (5) emit SSE events for the violation, (6) serve
  last-good-IR for the blocked tool's governance context, (7) allow the admin
  to diff the auto-snapshot against current state via the API, (8) on admin
  fix and recompile, transition back to CLEAN. The critical safety property is
  that a single R5-violating tool must not lock the entire workspace.

findings:
  - id: F01
    severity: critical
    description: >
      The auto-snapshot must be captured BEFORE the recompile begins, not
      after. If the snapshot is taken after recompilation, it captures the
      already-violated state and the admin cannot diff against the
      pre-violation baseline. The snapshot trigger must be wired to the
      file watcher's change detection event, not the compilation start event.
      If the file watcher and the compiler share an event queue, the snapshot
      must be enqueued before the compile request. A race where the compiler
      starts before the snapshot completes means the snapshot is useless.
    spec_impact: "CL-06 auto-snapshot — must complete before recompile starts; watcher triggers snapshot then compile sequentially"
    pitfall: null

  - id: F02
    severity: critical
    description: >
      The violation must be attributed to oc_runtime, not to the admin or
      the API. The compiler sees a changed TOOLS.md but does not inherently
      know who wrote it. The file watcher must tag the change source: if the
      change came through the PATCH API, the source is "api". If the file was
      modified externally without an API request in flight, the source is
      "external" (which includes oc_runtime). The violation audit record must
      include this source attribution so the admin knows the agent's runtime
      caused the violation, not a human edit.
    spec_impact: "CL-14 change attribution — file watcher tags source (api vs external); violation audit includes source"
    pitfall: null

  - id: F03
    severity: critical
    description: >
      Tool blocking must be per-tool, not workspace-wide. DEGRADED_R5 means
      a specific tool violates R5 policy. The GovernanceIR must mark individual
      tools with a blocked flag and a violation reason. When a partner requests
      a chunk containing the blocked tool, the chunk must include the tool with
      status "blocked" and reason "R5_MISSING_ELICITATION". Other tools in the
      same file must have status "active". If the implementation blocks all
      tools in TOOLS.md because one tool violates, the workspace is
      unnecessarily degraded.
    spec_impact: "CL-12 per-tool blocking — GovernanceIR marks individual tools blocked; other tools in same file remain active"
    pitfall: null

  - id: F04
    severity: critical
    description: >
      During DEGRADED_R5, the last-good-IR must be served for governance
      context of the blocked tool. If a partner queries "what is the
      governance policy for deploy-to-prod?", the response must come from
      the last compilation where deploy-to-prod was either absent or
      compliant. Serving the current IR (which has the R5 violation) as
      authoritative governance context is dangerous — the partner might
      interpret the tool as available. The last-good-IR cache must be indexed
      per-tool, not just per-compilation.
    spec_impact: "CL-10 last-good-IR — per-tool IR cache; blocked tools served from last compliant compilation"
    pitfall: null

  - id: F05
    severity: critical
    description: >
      PATCH requests must be blocked for the violating tool during
      DEGRADED_R5. If a partner tries to PATCH the blocked tool's
      configuration, the response must be 403 with error type
      R5_TOOL_BLOCKED. However, PATCH requests for other tools and other
      OC files must succeed normally. The PATCH handler must check the
      target tool's blocked status, not the workspace-level degraded state.
      A blanket PATCH block during DEGRADED_R5 is too aggressive.
    spec_impact: "CL-10 PATCH in DEGRADED_R5 — 403 for blocked tool only; other PATCHes succeed; check per-tool status"
    pitfall: null

  - id: F06
    severity: major
    description: >
      SSE events must be emitted for both the violation detection and the
      resolution. The violation event must include: event type
      "governance:violation", the tool name, the violation type
      (R5_MISSING_ELICITATION), the source (oc_runtime), and the new state
      (DEGRADED_R5). The resolution event must include: event type
      "governance:resolved", the tool name, and the new state (CLEAN).
      Partners subscribed to SSE use these events to update UI badges and
      alert dashboards in real time.
    spec_impact: "CL-10 SSE events — governance:violation and governance:resolved events with tool name, type, source, state"
    pitfall: null

  - id: F07
    severity: major
    description: >
      The admin diff endpoint (GET /api/diff?from=auto:previous&to=current)
      must show a structured diff of OC changes, not a raw text diff. The
      diff must identify: files changed, tools added/removed/modified, risk
      classifications changed, and governance violations introduced. A raw
      text diff requires the admin to manually interpret what changed. The
      structured diff allows UI rendering of "Tool 'deploy-to-prod' added
      with risk R5, missing elicitation gate."
    spec_impact: "CL-06 admin diff — structured diff showing tools, risk levels, violations; not raw text"
    pitfall: null

  - id: F08
    severity: major
    description: >
      Admin rollback via auto-snapshot restore must trigger a full recompile,
      not just a file restore. If the admin calls POST /api/snapshots/restore
      with the auto:pre-install snapshot, the files revert but the
      GovernanceIR still reflects the violated state until recompilation.
      The restore endpoint must atomically restore files AND trigger a
      recompile. If the recompile succeeds with no violations, the state
      transitions to CLEAN. The restore must be atomic — partial file
      restoration creates inconsistency.
    spec_impact: "CL-06 snapshot restore — atomic file restore + recompile; no gap between file state and IR state"
    pitfall: null

  - id: F09
    severity: major
    description: >
      The audit trail must record the full lifecycle: (1) OC runtime wrote
      to TOOLS.md at timestamp T1, (2) auto-snapshot captured at T2,
      (3) recompile started at T3, (4) violation detected at T4,
      (5) DEGRADED_R5 entered at T5, (6) admin viewed diff at T6,
      (7) admin fixed at T7, (8) CLEAN restored at T8. Each entry must
      include the actor (oc_runtime, system, admin), the action, and the
      result. Without this trail, post-incident review cannot reconstruct
      what happened.
    spec_impact: "CL-10 audit trail — full lifecycle with actor, action, result, timestamps for violation incidents"
    pitfall: null

  - id: F10
    severity: major
    description: >
      If the OC runtime installs multiple skills in rapid succession (e.g.,
      three writes to TOOLS.md within 200ms), the file watcher must coalesce
      the changes into a single recompile, but the auto-snapshot must capture
      the state before the FIRST write, not before each write. If three
      snapshots are taken, the second and third already contain the first
      skill's changes. The snapshot must be debounced to capture the clean
      baseline, while the recompile is debounced to process all changes at
      once.
    spec_impact: "CL-14 rapid writes — snapshot captures pre-first-write state; recompile debounced; no intermediate snapshots"
    pitfall: null

  - id: F11
    severity: major
    description: >
      If the installed skill contains a mix of R1-R4 tools and one R5 tool,
      only the R5 tool must be blocked. The R1-R4 tools must be registered
      and active immediately. The compiler must evaluate each tool
      independently for policy compliance, not evaluate the skill as a
      unit. A skill-level block (blocking all tools because one violates)
      is overly broad and degrades the agent's capabilities unnecessarily.
    spec_impact: "CL-12 mixed-risk skills — per-tool evaluation; R1-R4 tools active; only R5 violators blocked"
    pitfall: null

  - id: F12
    severity: warning
    description: >
      The DEGRADED_R5 state must appear in the status endpoint
      (GET /api/status) with details: which tools are blocked, why, when
      the violation was detected, and whether an auto-snapshot is available
      for rollback. The status response must distinguish between "one tool
      blocked" and "multiple tools blocked" so the admin can prioritize.
      If status reports only the state name without details, the admin must
      query additional endpoints to understand the situation.
    spec_impact: "CL-10 status endpoint — DEGRADED_R5 details: blocked tools, reasons, timestamps, snapshot availability"
    pitfall: null

  - id: F13
    severity: warning
    description: >
      The file watcher must distinguish between OC runtime writes and user
      editor writes (e.g., VS Code save). While both are "external" from
      the API's perspective, the violation severity may differ: OC runtime
      writes are programmatic and may indicate a misconfigured agent, while
      user edits are likely intentional experimentation. The audit trail
      should capture whatever distinguishing signals are available (process
      name via lsof/handle, write pattern, file lock holder) even if
      attribution is best-effort.
    spec_impact: "CL-14 write attribution — best-effort process identification; audit records distinguishing signals"
    pitfall: null

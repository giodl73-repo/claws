name: S29-data-sensitivity-escalation
series: cap-integration
version: 1
specs: [CL-10, CL-12]
description: >
  Validates that enabling a CONFIDENTIAL knowledge source (e.g., a SharePoint
  site with restricted data) via PATCH /api/chunks/memory is blocked when the
  agent has no audit trail configured. CONFIDENTIAL data access requires an
  active @bic/audit-chain extension. If the audit trail is configured and
  the agent's trust tier is T2 or above, the edit succeeds. If the trust tier
  is below T2, CONFIDENTIAL access is blocked regardless of audit trail status.
  RESTRICTED data (higher than CONFIDENTIAL) requires T3+.

expect:
  patch_without_audit:
    method: PATCH
    path: /api/chunks/memory
    body: "{ sourceId: 'sp-hr-restricted', sensitivity: 'CONFIDENTIAL', enabled: true }"
    status: 422
    response_shape:
      error: "G-DATA"
      message_contains: "CONFIDENTIAL data access requires audit trail"
      sourceId: "sp-hr-restricted"
      requiredExtension: "@bic/audit-chain"
  patch_with_audit_t2:
    method: PATCH
    path: /api/chunks/memory
    body: "{ sourceId: 'sp-hr-restricted', sensitivity: 'CONFIDENTIAL', enabled: true }"
    precondition: "audit-chain configured, trust tier >= T2"
    status: 200
    chunk_warning: "governance.dataSensitivity"
  patch_with_audit_t1:
    method: PATCH
    path: /api/chunks/memory
    body: "{ sourceId: 'sp-hr-restricted', sensitivity: 'CONFIDENTIAL', enabled: true }"
    precondition: "audit-chain configured, trust tier T1"
    status: 403
    error: "TRUST_TIER_INSUFFICIENT"
  restricted_data_t2:
    method: PATCH
    path: /api/chunks/memory
    body: "{ sourceId: 'sp-exec-financials', sensitivity: 'RESTRICTED', enabled: true }"
    precondition: "audit-chain configured, trust tier T2"
    status: 403
    error: "TRUST_TIER_INSUFFICIENT"
    message_contains: "RESTRICTED requires T3+"

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A CAP settings partner sends PATCH /api/chunks/memory to enable a SharePoint
  knowledge source tagged CONFIDENTIAL. The agent's workspace has no
  @bic/audit-chain extension configured. The compiler must detect the
  sensitivity mismatch during write-time validation and produce a G-DATA
  governance violation. The chunk must show a warning explaining the requirement.
  If the audit trail IS configured (via @bic/audit-chain), the edit is
  allowed only if the agent's trust tier is T2 or above. Below T2, CONFIDENTIAL
  access is always blocked. RESTRICTED data (the tier above CONFIDENTIAL)
  requires T3+ regardless of audit trail. The scenario also covers label
  mismatch (source metadata says INTERNAL but actual content is CONFIDENTIAL),
  label inheritance from parent SharePoint sites, and multi-source workspaces
  where sources have different sensitivity levels.

findings:
  - id: F01
    severity: major
    description: >
      Sensitivity label mismatch: the SharePoint source metadata claims
      sensitivity level INTERNAL, but the actual document content is tagged
      CONFIDENTIAL by Microsoft Purview Information Protection. The compiler
      must resolve this conflict by using the higher of the two labels
      (CONFIDENTIAL). If the compiler trusts only the source-level metadata,
      it allows access to CONFIDENTIAL content under INTERNAL rules — a
      data leak. The resolution strategy must be: max(source_label,
      content_label) with a governance warning about label mismatch.
    spec_impact: "CL-10 data sensitivity — resolve label conflicts via max(source_label, content_label); emit mismatch warning"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Data label inheritance from parent SharePoint site: a document library
      inherits its sensitivity label from the parent site unless explicitly
      overridden at the library or document level. If the parent site is
      CONFIDENTIAL but the specific library was not explicitly labeled, the
      compiler must walk the inheritance chain to determine the effective
      label. Missing inheritance resolution means unlabeled libraries under
      a CONFIDENTIAL site are treated as PUBLIC — a severe data leak.
    spec_impact: "CL-10 data sensitivity — resolve SharePoint label inheritance chain; unlabeled inherits from parent"
    pitfall: null

  - id: F03
    severity: major
    description: >
      Multiple sources at different sensitivity levels in the same MEMORY.md:
      one source is PUBLIC, another INTERNAL, a third CONFIDENTIAL. The
      effective workspace sensitivity is the maximum across all enabled
      sources. If the agent's trust tier qualifies for INTERNAL but not
      CONFIDENTIAL, enabling the third source must be blocked even though
      the first two are already enabled. The governance state must track
      per-source sensitivity AND aggregate workspace sensitivity.
    spec_impact: "CL-10 governance — track per-source and aggregate workspace sensitivity; enforce tier against aggregate"
    pitfall: null

  - id: F04
    severity: major
    description: >
      Audit trail configured but chain integrity broken: the
      @bic/audit-chain extension is installed but the prevHash chain
      has a gap (a record was deleted or tampered with). The compiler
      must verify chain integrity before granting CONFIDENTIAL access.
      A broken chain means the audit trail is unreliable — the G-DATA
      violation should fire with error code AUDIT_CHAIN_INTEGRITY_BROKEN,
      distinct from AUDIT_CHAIN_MISSING.
    spec_impact: "CL-10 audit-chain — verify chain integrity (prevHash continuity) before granting elevated data access"
    pitfall: null

  - id: F05
    severity: major
    description: >
      RESTRICTED data (higher than CONFIDENTIAL) requires T3+ even with
      a valid audit trail. The trust tier matrix must be enforced:
      PUBLIC = T0+, INTERNAL = T1+, CONFIDENTIAL = T2+ with audit,
      RESTRICTED = T3+ with audit + manager approval. If the tier matrix
      is not explicitly codified in GovernanceIR, the compiler cannot
      enforce it. The matrix must be a first-class governance artifact.
    spec_impact: "CL-10 GovernanceIR — codify sensitivity-tier matrix as first-class governance artifact"
    pitfall: null

  - id: F06
    severity: warning
    description: >
      The sensitivity label is not stored in MEMORY.md but in the source
      itself (SharePoint metadata, Purview label, or site classification).
      The compiler must fetch or cache the sensitivity label at compilation
      time. If the label changes in SharePoint after compilation, the
      cached label is stale. A staleness window exists between SharePoint
      label change and the next recompilation. The chunk should include
      a labelLastChecked timestamp so the partner can assess freshness.
    spec_impact: "CL-10 compilation — cache source sensitivity labels with timestamp; include labelLastChecked in chunks"
    pitfall: null

  - id: F07
    severity: warning
    description: >
      When a CONFIDENTIAL source is enabled and the audit trail is valid,
      the chunk must include a governance.dataSensitivity warning visible
      to the partner UI. This warning is informational (not blocking) but
      serves as a persistent reminder that the agent is accessing
      CONFIDENTIAL data. If the warning is only emitted once (at enable
      time) but not on subsequent GET /api/chunks, the partner loses
      visibility into the ongoing elevated access.
    spec_impact: "CL-10 chunks — governance.dataSensitivity warning persists on every GET, not just at enable time"
    pitfall: null

  - id: F08
    severity: warning
    description: >
      Disabling a CONFIDENTIAL source does not immediately reduce the
      workspace sensitivity if cached data from that source is still in
      the agent's context window. The compiler can mark the source as
      disabled in MEMORY.md, but the agent runtime may still have
      CONFIDENTIAL content in its conversation history. The governance
      state should track a cooldown period or require a context flush
      before downgrading the effective sensitivity level.
    spec_impact: "CL-10 governance — sensitivity downgrade requires context flush or cooldown period after source disable"
    pitfall: null

  - id: F09
    severity: warning
    description: >
      The G-DATA violation response must include actionable guidance for
      the partner UI: what extension to install (@bic/audit-chain),
      what trust tier is needed (T2+), and how to request a tier escalation
      (link to /api/trust/escalate). Without this, the user sees a generic
      "access denied" and has no path to resolution. The violation response
      must include a resolutionSteps array.
    spec_impact: "CL-10 G-DATA violation — include resolutionSteps array with extension, tier, and escalation path"
    pitfall: null

  - id: F10
    severity: warning
    description: >
      Bulk source enable: if a partner PATCHes MEMORY.md to enable 5
      sources at once, and 3 are PUBLIC but 2 are CONFIDENTIAL, the
      validation must identify exactly which sources are blocked and
      which can proceed. A blanket rejection of the entire PATCH forces
      the partner to retry without the CONFIDENTIAL sources. The response
      must enumerate per-source status (allowed/blocked with reason).
    spec_impact: "CL-10 PATCH — per-source validation result in bulk enable; enumerate allowed/blocked with reasons"
    pitfall: null

  - id: F11
    severity: note
    description: >
      Audit trail for the sensitivity check itself: when the compiler
      evaluates a source's sensitivity and grants or denies access, that
      decision must be logged in the audit chain. This creates an audit
      trail of sensitivity decisions, not just the data access events
      themselves. Without it, a compliance reviewer cannot determine why
      a CONFIDENTIAL source was enabled or when the sensitivity check
      was last performed.
    spec_impact: "CL-10 audit — log sensitivity evaluation decisions (grant/deny) with source, label, tier, and reason"
    pitfall: null

  - id: F12
    severity: note
    description: >
      Cross-tenant sensitivity: if the SharePoint source belongs to a
      different Entra tenant than the agent's organization, the sensitivity
      labels may use different classification schemes. A "CONFIDENTIAL"
      label in Tenant A may map to "RESTRICTED" in Tenant B. Cross-tenant
      source access must either normalize labels to a common scheme or
      default to the highest possible classification (RESTRICTED) for
      safety. This is an enterprise governance edge case that must at
      minimum be documented.
    spec_impact: "CL-10 cross-tenant — normalize or default-to-max for sensitivity labels from external tenants"
    pitfall: null

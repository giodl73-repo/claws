name: S02-zero-craftworks-imports
series: emit-cc
version: 1
specs: [CL-08]
description: >
  Validates that emit-cc output (CLAUDE.md + .claude/settings.json) contains
  zero references to @craftworks/ internal packages — the output is Claude
  Code native.

expect:
  craftworks_import_count: 0
  platform_native: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  After emit-cc produces CLAUDE.md and .claude/settings.json, both files are
  scanned for any string matching "@craftworks/" or "craftworks-" package
  references. CLAUDE.md must contain governance instructions using plain
  English, not references to internal package APIs. settings.json must
  contain standard Claude Code configuration keys, not @craftworks/
  specific extensions. Any internal reference in these files confuses
  Claude Code (which does not know about @craftworks/) and confuses
  users who see unfamiliar package names in their configuration.

findings:
  - id: F01
    severity: major
    description: >
      Governance instructions that reference @craftworks/governance rule IDs
      (e.g., "enforce rule GOV-042 from @craftworks/governance") are meaningless
      to Claude Code. The emitter must expand rule references into their
      full natural-language instruction text. Claude Code interprets
      instructions, not package identifiers.
    spec_impact: "CL-08 emitter-isolation — expand rule IDs to natural language in CLAUDE.md"
    pitfall: null

  - id: F02
    severity: major
    description: >
      If settings.json contains custom configuration keys namespaced under
      "craftworks" (e.g., {"craftworks.governance": {...}}), Claude Code
      ignores them as unknown keys. The governance settings must map to
      standard Claude Code configuration keys (permissions, allowedTools,
      etc.) to actually be enforced.
    spec_impact: "CL-08 emitter-isolation — map governance to standard CC settings keys"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      Provenance metadata embedded in CLAUDE.md (e.g., "Generated by
      @craftworks/emit-cc v1.2.0") contains an @craftworks/ reference.
      The generation header should use the product name "claws" instead
      of the npm package name to maintain the zero-import contract.
    spec_impact: "CL-08 emitter-isolation — use product name, not package name, in headers"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      Error recovery instructions in CLAUDE.md (e.g., "Run claws compile
      to regenerate this file") should not reference @craftworks/ CLI
      commands. The instruction should use the user-facing claws CLI
      command name which is platform-independent.
    spec_impact: "CL-08 emitter-isolation — user-facing command names in emitted instructions"
    pitfall: null

  - id: F05
    severity: note
    description: >
      The scan should also check for craftworks monorepo file paths
      (e.g., "compiler-sdk/src/") that may leak through template
      interpolation from the build environment. These paths are
      meaningless in the consumer's workspace.
    spec_impact: "CL-08 emitter-isolation — build-environment path leak detection"
    pitfall: null

  - id: F06
    severity: note
    description: >
      Comments in settings.json (if JSON5 or JSONC format is used) must
      also be scanned. A comment like "// from @craftworks/governance"
      violates the zero-import contract even though it has no runtime
      effect.
    spec_impact: "CL-08 emitter-isolation — comment scanning for JSON config files"
    pitfall: null

  - id: F07
    severity: note
    description: >
      The zero-import scan regex should match both "@craftworks/" (npm scope)
      and "craftworks-" (unscoped package prefix) to catch any naming
      convention used across the monorepo.
    spec_impact: "CL-08 emitter-isolation — scan pattern must cover all naming conventions"
    pitfall: null

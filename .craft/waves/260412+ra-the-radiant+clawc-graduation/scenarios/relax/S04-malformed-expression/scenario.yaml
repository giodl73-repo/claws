name: S04-malformed-expression
series: relax
version: 1
specs: [CL-08]
description: >
  Validates that the RELAX parser produces an actionable error with line
  and column information when given a malformed expression, rather than
  throwing a generic stack trace. Error quality is a core DX differentiator
  for a standalone expression library: developers must be able to fix
  their expressions from the error message alone.

expect:
  input: "if risk >= then 'block'"
  parse_result:
    success: false
    error:
      message_contains: "expected expression after '>=' operator"
      line: 1
      column: 15
      source_snippet: "if risk >= then 'block'"
      pointer: "              ^"
  recovery:
    partial_ast: null
    suggestions: ["Did you mean 'if risk >= 3 then ...'?"]

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A developer writes a malformed RELAX expression: "if risk >= then 'block'"
  (missing the right-hand operand of the >= comparison, and missing the
  else branch). The parser must detect the error at column 15 (the "then"
  keyword where an expression was expected), report the line and column,
  show a source snippet with a caret pointer, and provide a human-readable
  message explaining what was expected. The error must not be a JavaScript
  SyntaxError, TypeError, or other runtime exception. It must be a typed
  ParseError from the relax package with structured fields.

findings:
  - id: F01
    severity: major
    description: >
      The error must include line and column numbers relative to the
      expression source, not relative to the file containing the expression.
      If a RELAX expression is embedded in SOUL.md at line 47, the parser
      error should report line 1, column 15 of the expression, plus the
      embedding context (file path, offset) if provided. Mixing expression-
      relative and file-relative positions makes errors unlocatable.
    spec_impact: "CL-08 relax — error position coordinates (expression-relative + optional file context)"
    pitfall: null

  - id: F02
    severity: major
    description: >
      The error must not expose parser internals. Messages like "Unexpected
      token T_THEN in state EXPR_RHS" are generated by parser generators
      and are meaningless to a governance author. The error must use domain
      language: "expected expression after '>=' operator, found keyword
      'then'." Error message quality must be tested as part of the relax
      test suite, not left to the parser generator's defaults.
    spec_impact: "CL-08 relax — human-readable error messages, not parser-generator output"
    pitfall: null

  - id: F03
    severity: major
    description: >
      The caret pointer in the source snippet must account for multi-byte
      characters. If the expression contains Unicode (e.g., "if リスク >= then"),
      the caret position must align with the visual column, not the byte
      offset. JavaScript string indexing is by UTF-16 code units, which
      disagrees with visual width for CJK characters. The snippet renderer
      must use a display-width-aware column calculation.
    spec_impact: "CL-08 relax — Unicode-aware error caret alignment"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      The missing else branch is a second error in the same expression.
      The parser should report both errors if possible (multi-error
      recovery), or at minimum report the first error clearly enough that
      fixing it reveals the second. If the parser stops at the first error,
      it must not leave partial state that causes a confusing cascading
      error on the next parse attempt.
    spec_impact: "CL-08 relax — multi-error recovery or clean single-error stopping"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      The typed ParseError must be exported from the relax package so
      consumers can catch it specifically. If parse() throws a generic
      Error, consumers cannot distinguish between a malformed expression
      (fixable by the user) and a parser bug (reportable as an issue).
      ParseError should have fields: message, line, column, source, and
      an optional suggestions array.
    spec_impact: "CL-08 relax — ParseError type export with structured fields"
    pitfall: null

  - id: F06
    severity: warning
    description: >
      Error suggestions ("Did you mean...?") are valuable but dangerous.
      If the suggestion engine is too aggressive, it suggests syntactically
      valid but semantically wrong fixes. If a developer writes
      "if risk >= then" and the suggestion is "if risk >= 3 then...",
      the threshold 3 is made up. Suggestions should be structural ("add
      an expression after '>='") not value-level ("use 3"). Never suggest
      specific binding values.
    spec_impact: "CL-08 relax — suggestion engine scoped to structural, not value, fixes"
    pitfall: null

  - id: F07
    severity: note
    description: >
      Error messages must be stable across relax versions. If a governance
      team writes documentation referencing specific error messages (e.g.,
      "if you see 'expected expression after operator'"), a version bump
      that changes the message text breaks their docs. Error codes (e.g.,
      RELAX-E001) provide stability even when message text is improved.
    spec_impact: "CL-08 relax — stable error codes alongside human-readable messages"
    pitfall: null

  - id: F08
    severity: note
    description: >
      The partial_ast field in the expect block is null, indicating the
      parser does not produce a partial AST on error. Some parsers (like
      TypeScript's) produce a "best effort" AST even with errors, which
      enables IDE features (autocomplete on incomplete expressions). If
      relax targets IDE integration (LSP support mentioned in enterprise
      tier), partial AST production is valuable. But for the standalone
      building block, it adds complexity. Defer to enterprise tier.
    spec_impact: "CL-08 relax — partial AST production deferred to enterprise"
    pitfall: null

  - id: F09
    severity: warning
    description: >
      The error must be serializable to JSON for fleet reporting. If a
      fleet of 47 workspaces compiles RELAX expressions and 3 have errors,
      the fleet operator receives a JSON report with all 3 errors. The
      ParseError must implement toJSON() with all structured fields. If
      toJSON() is missing, JSON.stringify(error) produces {} (JavaScript
      Error objects do not serialize by default), losing all diagnostic
      information.
    spec_impact: "CL-08 relax — ParseError.toJSON() for fleet error aggregation"
    pitfall: null

name: S01-standalone-install
series: emit-cc
version: 1
specs: [CL-08]
description: >
  Validates that @craftworks/emit-cc installs with only @craftworks/codegen
  as a dependency and produces Claude Code governance output (CLAUDE.md +
  .claude/settings.json).

expect:
  craftworks_deps: ["@craftworks/codegen"]
  output_files: ["CLAUDE.md", ".claude/settings.json"]
  output_valid: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A consumer installs @craftworks/emit-cc in a fresh project alongside
  @craftworks/codegen. No other @craftworks packages are pulled. The consumer
  invokes the emitter with a compiled governance IR. The emitter produces
  two files: CLAUDE.md containing governance instructions in markdown format
  that Claude Code reads as system context, and .claude/settings.json with
  permission and tool configuration. Both files must be syntactically valid
  and conform to Claude Code's expected formats.

findings:
  - id: F01
    severity: major
    description: >
      CLAUDE.md has no formal schema — Claude Code reads it as free-form
      markdown. If the emitter produces governance rules in a format that
      Claude Code's instruction parser does not reliably follow (e.g.,
      deeply nested lists, HTML tables), the governance may be partially
      ignored at runtime. The emitter must use flat, imperative instruction
      format that Claude Code reliably interprets.
    spec_impact: "CL-08 emit-cc — CLAUDE.md format must use flat imperative instructions"
    pitfall: null

  - id: F02
    severity: major
    description: >
      .claude/settings.json has a defined schema that changes across Claude
      Code versions. If the emitter produces fields that only exist in newer
      versions, consumers on older Claude Code versions get parse errors.
      The emitter must target a minimum Claude Code version and document it.
    spec_impact: "CL-08 emit-cc — minimum Claude Code version target for settings.json"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      If the workspace already has a CLAUDE.md with user-written instructions,
      the emitter must merge governance sections rather than overwriting the
      entire file. Overwriting destroys user customizations that may be
      critical to their workflow. The emitter should use delimited sections
      (e.g., <!-- claws:start --> ... <!-- claws:end -->) for safe merging.
    spec_impact: "CL-08 emit-cc — section-delimited merge for existing CLAUDE.md"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      The .claude/ directory may already contain settings from the user's
      manual configuration. The emitter must deep-merge its governance
      settings with existing settings, not replace the entire file. JSON
      merge must handle arrays (permissions lists) by deduplication, not
      replacement.
    spec_impact: "CL-08 emit-cc — deep merge for existing .claude/settings.json"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      Governance instructions in CLAUDE.md that reference file paths must
      use relative paths from the workspace root, not absolute paths from
      the build machine. Absolute paths break when the workspace is cloned
      to a different location.
    spec_impact: "CL-08 emit-cc — relative path requirement in emitted CLAUDE.md"
    pitfall: null

  - id: F06
    severity: note
    description: >
      The emitter should generate a human-readable header in CLAUDE.md
      explaining that the governance section was auto-generated by claws
      and should not be manually edited. This prevents users from
      modifying generated content that will be overwritten on next compile.
    spec_impact: "CL-08 emit-cc — auto-generation notice in emitted CLAUDE.md"
    pitfall: null

  - id: F07
    severity: note
    description: >
      settings.json permissions should be as restrictive as the governance
      policy requires, not maximally permissive. If the emitter defaults
      to allowing all tools and the governance policy only permits read
      operations, the settings do not enforce the policy.
    spec_impact: "CL-08 emit-cc — settings must reflect governance restrictions"
    pitfall: null

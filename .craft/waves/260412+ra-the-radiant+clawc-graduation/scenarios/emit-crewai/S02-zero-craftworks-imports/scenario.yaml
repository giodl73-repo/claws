name: S02-zero-craftworks-imports
series: emit-crewai
version: 1
specs: [CL-08]
description: >
  Validates that emit-crewai output (crew_governance.py) contains zero
  references to @craftworks/ internal packages — the output is CrewAI-native
  Python.

expect:
  craftworks_import_count: 0
  platform_native: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  After emit-crewai produces crew_governance.py, the Python file is scanned
  for any string matching "@craftworks/", "craftworks", or "craftworks_" in
  import statements, string literals, comments, and docstrings. The file must
  only import from crewai, pydantic, typing, and Python standard library. Any
  craftworks reference in the output means the Python file references packages
  that do not exist in the Python ecosystem.

findings:
  - id: F01
    severity: major
    description: >
      Governance violation error messages in callback functions may contain
      rule descriptions copied from the governance IR. If these descriptions
      reference "@craftworks/governance rule GOV-042", the error message
      appears in CrewAI's verbose output and log files, exposing internal
      package names to Python developers and operators.
    spec_impact: "CL-08 emitter-isolation — sanitize governance rule descriptions in callbacks"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Pydantic model descriptions (Field(description="...")) generated from
      governance IR metadata may contain @craftworks/ references. These
      descriptions appear in CrewAI's schema output and agent prompts,
      potentially causing the AI agent to reference non-existent packages
      in its reasoning.
    spec_impact: "CL-08 emitter-isolation — sanitize Pydantic field descriptions"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      Python docstrings at the module level, class level, and function level
      may contain attribution text like "Generated by @craftworks/emit-crewai."
      All attribution should use the product name "claws" instead of the
      npm package name.
    spec_impact: "CL-08 emitter-isolation — product name attribution in Python docstrings"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      Logging statements in governance callbacks (e.g., logger.info("Checking
      craftworks governance...")) leak internal branding into the consumer's
      log output. Log messages should reference "governance" generically or
      use the product name "claws."
    spec_impact: "CL-08 emitter-isolation — neutral branding in log messages"
    pitfall: null

  - id: F05
    severity: note
    description: >
      Type alias names generated from the IR (e.g., CraftworksPolicy = TypedDict(...))
      leak the internal brand into the consumer's Python namespace. Type names
      should use domain-relevant names (GovernancePolicy, ComplianceRule)
      without the craftworks prefix.
    spec_impact: "CL-08 emitter-isolation — brand-free type alias names"
    pitfall: null

  - id: F06
    severity: note
    description: >
      Comments marking code sections (e.g., "# --- craftworks governance start ---")
      should use neutral markers (e.g., "# --- governance constraints start ---")
      to avoid craftworks references in the output.
    spec_impact: "CL-08 emitter-isolation — neutral section markers in comments"
    pitfall: null

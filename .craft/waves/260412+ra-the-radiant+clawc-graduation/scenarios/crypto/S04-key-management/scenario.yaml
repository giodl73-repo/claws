name: S04-key-management
series: crypto
version: 1
specs: [CL-08]
description: >
  Validates that Ed25519 keypair export/import round-trip preserves signing
  capability. A keypair generated by @craftworks/crypto, exported to a portable
  format, and re-imported must produce identical signatures. This tests key
  serialization correctness and cross-environment portability.

expect:
  round_trip:
    export_format: "base64_raw"
    import_recovers_signing: true
    signature_identical: true
  key_properties:
    private_key_bytes: 32
    public_key_bytes: 32
    keypair_deterministic_from_seed: true
  storage:
    plaintext_export_warning: true
    no_filesystem_persistence: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A keypair is generated via @craftworks/crypto generate(). The private key and
  public key are exported as base64-encoded raw bytes (32 bytes each). The exports
  are stored in a JSON config file. In a separate process, the exports are read
  back and imported via @craftworks/crypto import(). A message is signed with the
  imported keypair. The signature must be identical to one produced by the original
  keypair (Ed25519 is deterministic). The public key derived from the imported
  private key must match the exported public key. The test must also verify that
  importing a malformed key (wrong length, invalid bytes) produces a clear error.

findings:
  - id: F01
    severity: major
    description: >
      Ed25519 private keys have two common representations: the 32-byte seed
      (from which the 64-byte expanded key is derived) and the 64-byte expanded
      key itself. If generate() exports the 64-byte expanded key and import()
      expects the 32-byte seed, the import will produce a different keypair.
      CL-08 must specify: export/import uses the 32-byte seed, not the 64-byte
      expanded key. The seed is the portable representation.
    spec_impact: "CL-08 @craftworks/crypto — key export uses 32-byte seed, not 64-byte expanded"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Node.js crypto.generateKeyPairSync('ed25519') returns keys in PKCS#8
      (private) and SPKI (public) DER format by default, not raw bytes. If
      export() returns the DER-encoded key and a consumer on a different
      runtime (e.g., Deno, Bun) expects raw bytes, the import will fail.
      The export format must be raw 32-byte seed + 32-byte public key,
      base64-encoded, regardless of the internal Node.js representation.
    spec_impact: "CL-08 @craftworks/crypto — export: raw bytes base64, not DER/PKCS#8"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      Base64 encoding has variants: standard (RFC 4648) vs URL-safe
      (RFC 4648 section 5). If export() uses standard base64 but import()
      expects URL-safe, keys with + or / characters will fail. The encoding
      must be specified: standard base64 with padding (=). URL-safe can be
      a second option but standard must be the default.
    spec_impact: "CL-08 @craftworks/crypto — base64 variant: standard RFC 4648 with padding"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      Importing a 31-byte key (off by one) should produce a clear error
      message: "Invalid Ed25519 seed: expected 32 bytes, got 31". If the
      import function passes the truncated key to Node.js crypto without
      validation, the error message will be an opaque "ERR_CRYPTO_INVALID_KEY"
      from the C++ layer. Key length validation must happen before passing
      to the crypto API.
    spec_impact: "CL-08 @craftworks/crypto — pre-validation of key length before native API call"
    pitfall: null

  - id: F05
    severity: major
    description: >
      Plaintext private key export (base64 in a JSON file) is a security
      risk. The export() function should emit a warning or require an
      acknowledgment parameter (e.g., { allowPlaintext: true }) to prevent
      accidental plaintext export. In production, keys should be stored in
      a keyring or encrypted vault. CL-08 should document the security
      posture: the crypto package provides primitives, not key storage.
      Secure storage is the consumer's responsibility.
    spec_impact: "CL-08 @craftworks/crypto — plaintext export warning, no built-in secure storage"
    pitfall: null

  - id: F06
    severity: note
    description: >
      The public key derivation from a private seed is a one-way operation
      (scalar multiplication on the Ed25519 curve). The import() function
      should accept a seed-only import and derive the public key internally,
      not require both seed and public key. This simplifies the export format
      (only the seed needs to be persisted) and eliminates the possibility
      of a mismatched seed/public-key pair.
    spec_impact: "CL-08 @craftworks/crypto — import accepts seed-only, derives public key"
    pitfall: null

  - id: F07
    severity: warning
    description: >
      If the JSON config file containing exported keys is committed to git,
      the private key is leaked. The export documentation should warn against
      this and suggest adding key files to .gitignore. A post-export lint
      check (e.g., in the CLI) could detect committed private keys and warn.
    spec_impact: "CL-08 @craftworks/crypto — export documentation warns against git commit of key material"
    pitfall: null

  - id: F08
    severity: note
    description: >
      The deterministic seed-to-keypair derivation should be tested with
      known test vectors from RFC 8032 Section 7.1. If @craftworks/crypto
      produces a different public key from a known test vector seed, the
      Ed25519 implementation is incorrect. Test vectors are the gold standard
      for cryptographic correctness.
    spec_impact: "CL-08 @craftworks/crypto — RFC 8032 Section 7.1 test vector validation"
    pitfall: null

  - id: F09
    severity: note
    description: >
      Multiple import() calls with the same seed should produce the same
      keypair object (or at least functionally identical keypairs). If
      import() returns a new object each time, callers that use reference
      equality for keypair comparison will break. The contract should be:
      import is pure (same input -> same behavior), but reference equality
      is not guaranteed.
    spec_impact: "CL-08 @craftworks/crypto — import() is pure: same seed -> same signing behavior"
    pitfall: null

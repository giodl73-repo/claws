name: S02-audit-chain-continuity
series: crypto
version: 1
specs: [CL-08]
description: >
  Validates that an audit chain started by agent-sdk's hash-chain module can be
  continued by @craftworks/crypto's AuditChain with valid hash links. This tests
  the migration path: existing audit trails must remain valid after extraction.

expect:
  chain_continuity:
    agent_sdk_entries: 10
    crypto_appended_entries: 5
    total_chain_length: 15
    verification_result: "valid"
    hash_link_integrity: true
  backward_compatibility:
    agent_sdk_can_read: true
    crypto_can_read: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  An existing audit chain was created by agent-sdk's hash-chain module. It
  contains 10 entries, each Ed25519-signed, with SHA-256 hash links connecting
  each entry to its predecessor. The chain is exported as JSONL. @craftworks/crypto
  imports this JSONL chain, verifies all 10 entries, then appends 5 new entries
  using its own AuditChain.append(). The extended chain (15 entries) is verified
  by both @craftworks/crypto and agent-sdk's verify function. Both must report
  the chain as valid. The hash link from entry 10 (agent-sdk) to entry 11
  (crypto) must be computed identically by both implementations.

findings:
  - id: F01
    severity: major
    description: >
      The hash link computation takes the previous entry's hash and the current
      entry's content, then produces SHA-256(prev_hash + content_bytes). If
      agent-sdk concatenates as strings (SHA-256(prevHash + JSON.stringify(event)))
      and crypto concatenates as buffers (SHA-256(Buffer.concat([prevHashBuf,
      contentBuf]))), the hash link at the boundary (entry 10 -> 11) will break.
      Both must use identical concatenation: buffer-based, with a defined
      separator byte or no separator.
    spec_impact: "CL-08 @craftworks/crypto — hash link computation: buffer concat, no separator"
    pitfall: null

  - id: F02
    severity: major
    description: >
      The JSONL export format must be identical between agent-sdk and
      @craftworks/crypto. JSONL is newline-delimited JSON, but there are
      variants: trailing newline or not, \n or \r\n, JSON key ordering.
      If agent-sdk exports with unordered keys and crypto exports with
      sorted keys, a round-trip import-export will produce different bytes.
      The JSONL format must be canonicalized: sorted keys, \n line endings,
      no trailing newline.
    spec_impact: "CL-08 @craftworks/crypto — canonical JSONL format: sorted keys, LF, no trailing newline"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      The generic AuditChain<E> type means the event type E is caller-defined.
      Agent-sdk uses a specific event shape (timestamp, action, actor, metadata).
      If @craftworks/crypto's append() serializes E differently than agent-sdk
      (e.g., different date format, different field ordering), the hash of the
      new entry content will differ. The content serialization must be
      deterministic and documented.
    spec_impact: "CL-08 @craftworks/crypto — AuditChain event serialization: canonical JSON"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      The Ed25519 signing key for chain entries may differ between agent-sdk
      and crypto. If agent-sdk uses one keypair and crypto uses another, the
      chain has mixed signatures. The verify() function must support multi-
      signer chains: each entry includes the signer's public key, and
      verification uses the per-entry key. If verify() assumes a single
      signer, it will reject entries signed by a different key.
    spec_impact: "CL-08 @craftworks/crypto — AuditChain supports per-entry signer public keys"
    pitfall: null

  - id: F05
    severity: note
    description: >
      The genesis entry (entry 0) has no predecessor hash. Agent-sdk may use
      a sentinel value (e.g., 64 zero bytes) or null for the genesis prev_hash.
      If @craftworks/crypto uses a different sentinel, importing agent-sdk's
      chain will fail at the genesis entry. The genesis sentinel must be
      documented and agreed upon.
    spec_impact: "CL-08 @craftworks/crypto — genesis entry prev_hash: 64-byte zero sentinel"
    pitfall: null

  - id: F06
    severity: major
    description: >
      The timestamp field in chain entries must use the same format and
      precision. If agent-sdk uses Unix milliseconds (1712000000000) and
      @craftworks/crypto uses ISO 8601 ("2026-04-01T00:00:00.000Z"), the
      content bytes differ and the hash chain breaks at the boundary. The
      timestamp format must be ISO 8601 with millisecond precision and
      UTC timezone (the most interoperable format).
    spec_impact: "CL-08 @craftworks/crypto — chain entry timestamps: ISO 8601 UTC with ms precision"
    pitfall: null

  - id: F07
    severity: warning
    description: >
      Chain import from JSONL must validate each entry's hash and signature
      during import, not just store them. If import() skips validation and
      later append() trusts the imported head's hash, a tampered imported
      chain would silently extend with valid links atop a corrupted
      foundation. Import must verify the full chain or expose a verify-
      then-import workflow.
    spec_impact: "CL-08 @craftworks/crypto — chain import validates all entries before accepting"
    pitfall: null

  - id: F08
    severity: note
    description: >
      The continuity test should also cover the degenerate case: an empty
      chain imported from agent-sdk (0 entries). @craftworks/crypto should
      be able to start a new chain from scratch and produce a chain that
      agent-sdk can later verify. This tests the genesis creation path.
    spec_impact: "CL-08 @craftworks/crypto — empty chain import + genesis creation path"
    pitfall: null

  - id: F09
    severity: note
    description: >
      Large chains (10,000+ entries) should not require loading the entire
      chain into memory for verification. The verify() implementation should
      support streaming verification (verify entry by entry with only the
      previous hash in memory). If verify() loads all entries into an array,
      a 1M-entry enterprise audit chain will exhaust memory.
    spec_impact: "CL-08 @craftworks/crypto — streaming verification for large chains"
    pitfall: null

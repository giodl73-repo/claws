name: S43-structural-error-recovery
series: cap-integration
version: 2
specs: [CL-10, CL-06, CL-14]
description: >
  Validates behavior when a VS Code save corrupts an OC file (invalid YAML
  frontmatter, missing closing delimiter in SOUL.md). Recompilation fails with
  a structural error. The system enters ERROR state. The last good GovernanceIR
  from the compilation forest continues serving GET requests. PATCH returns
  503 with error details. The admin fixes the file, the file watcher detects
  the fix, recompilation succeeds, and the system transitions to CLEAN.

expect:
  structural_error:
    detection: compilation_failure
    cause: invalid_yaml_frontmatter
    state: ERROR
  last_good_ir:
    serves_get_requests: true
    header: "X-OC-Governance: error"
    stale_flag: true
  patch_behavior:
    status: 503
    body_includes_error_details: true
    body_includes_last_good_version: true
  recovery:
    file_watcher_detects_fix: true
    recompile_succeeds: true
    final_state: CLEAN
  sse_events:
    error_event: true
    recovery_event: true

simulate:
  failures:
    - type: file_corruption
      target: SOUL.md
      cause: "VS Code save with invalid YAML frontmatter"
  halt: null
  budget: null

problem: >
  A developer edits SOUL.md in VS Code and saves with a syntax error: the YAML
  frontmatter is missing its closing "---" delimiter, causing the entire file to
  be parsed as YAML (which fails). The file watcher detects the change and
  triggers recompilation. The compiler cannot parse SOUL.md and fails. The
  system must: (1) detect this as a structural error (not a governance
  violation), (2) enter ERROR state, (3) continue serving GET requests from the
  last known good GovernanceIR with a stale/error header, (4) return 503 for
  PATCH requests with a response body that includes the parse error details and
  the last good compilation version, (5) emit an SSE event for the error state,
  (6) when the developer fixes the file and saves again, the file watcher
  detects the fix, recompiles successfully, and transitions to CLEAN. The
  challenge is distinguishing structural errors (file cannot be parsed) from
  governance violations (file is valid but violates policy) — they produce
  different system states.

findings:
  - id: F01
    severity: critical
    description: >
      Structural errors and governance violations must produce different
      system states. A structural error (file cannot be parsed) produces
      ERROR state. A governance violation (file is valid but policy is
      violated) produces DEGRADED_R5 or DEGRADED_WARN. The distinction
      matters because ERROR means "the compiler cannot produce any IR from
      this file" while DEGRADED means "the compiler produced IR but found
      policy violations." If both produce the same state, partners cannot
      distinguish between "workspace is broken" and "workspace has a policy
      issue."
    spec_impact: "CL-10 state distinction — ERROR for structural (no IR possible); DEGRADED for governance (IR exists with violations)"
    pitfall: null

  - id: F02
    severity: critical
    description: >
      The last-good-IR cache must survive the ERROR state. When the compiler
      fails, it must NOT clear or invalidate the last-good-IR. The cache
      must be written atomically during successful compilations (write to
      temp, rename) so that a crash during cache write does not corrupt it.
      If the last-good-IR is lost during an ERROR state, GET requests have
      nothing to serve and must return 503 for all endpoints — a complete
      outage from a single typo.
    spec_impact: "CL-06 last-good-IR — atomic writes; never cleared on compilation failure; survives ERROR state"
    pitfall: null

  - id: F03
    severity: critical
    description: >
      GET requests during ERROR state must serve the last-good-IR with two
      signals: an X-OC-Governance: error header and a compilationStale: true
      flag in chunk responses. The response body must also include a
      compilation_error field with the parse error summary (not the full
      stack trace). Partners use the header to show an error banner and
      the stale flag to indicate the data may not reflect recent changes.
      If GETs return 503 during ERROR state (like during recovery), the
      workspace is completely unusable from a single file error.
    spec_impact: "CL-10 GET in ERROR — serve last-good-IR; X-OC-Governance: error header; compilationStale flag; compilation_error summary"
    pitfall: null

  - id: F04
    severity: critical
    description: >
      The 503 response for PATCH requests during ERROR state must include
      structured error details: the file that failed to parse, the line
      number and column of the parse error, the error message, and the
      last good compilation_id. This allows the partner to display
      actionable information: "SOUL.md line 1: missing YAML closing
      delimiter. Last good compilation: C42." Without line/column info,
      the admin must open the file and hunt for the error manually.
    spec_impact: "CL-10 503 body — file path, line, column, error message, last good compilation_id"
    pitfall: null

  - id: F05
    severity: critical
    description: >
      If the structural error is in lobster.yaml (the workspace
      configuration) rather than a markdown OC file, the severity is
      higher. A corrupted lobster.yaml may prevent the compiler from
      knowing which files to compile, what the workspace boundaries are,
      or what governance model applies. The system must still enter ERROR
      state and serve last-good-IR, but the error event should include an
      elevated urgency flag because the workspace configuration itself is
      broken, not just a content file.
    spec_impact: "CL-06 lobster.yaml errors — ERROR state with elevated urgency; workspace config corruption is higher severity"
    pitfall: null

  - id: F06
    severity: major
    description: >
      The file watcher must detect the fix (second save) and trigger
      recompilation automatically. The watcher must not stop watching a
      file after a failed compilation. If the watcher de-registers files
      that caused errors (to avoid repeated failed compiles), it will
      never detect the fix. The watcher must continue watching all files
      regardless of compilation outcome. Debouncing should prevent rapid
      re-compiles if the developer is making multiple saves.
    spec_impact: "CL-14 watcher persistence — continue watching files after compilation failure; never de-register on error"
    pitfall: null

  - id: F07
    severity: major
    description: >
      Recovery timing from fix to CLEAN should be measured and bounded.
      When the developer fixes SOUL.md and saves, the expected path is:
      file watcher detects change (< 500ms) -> recompile starts ->
      recompile succeeds -> CLEAN. The total recovery time should be
      under 2 seconds for a typical workspace. If recovery takes longer
      (e.g., because the watcher is debouncing aggressively after the
      error), the developer experiences an unnecessary delay. The
      debounce window should be shorter after an ERROR state to
      prioritize recovery.
    spec_impact: "CL-14 recovery timing — < 2s from fix to CLEAN; shorter debounce window during ERROR state"
    pitfall: null

  - id: F08
    severity: major
    description: >
      SSE events must be emitted for both the ERROR state entry and the
      CLEAN recovery. The error event type is "workspace:error" with the
      parse error details (file, line, column, message). The recovery
      event type is "workspace:recovered" with the new compilation_id.
      Between error and recovery, no "workspace:changed" events should
      be emitted (the workspace is in an error state, not a changed
      state). If the watcher emits change events during ERROR, partners
      may attempt to refresh data that is stale anyway.
    spec_impact: "CL-10 SSE — workspace:error and workspace:recovered events; no workspace:changed during ERROR"
    pitfall: null

  - id: F09
    severity: major
    description: >
      Concurrent error and external edit must be handled correctly. If
      SOUL.md has a structural error (ERROR state) and simultaneously
      TOOLS.md is edited externally, the system cannot recompile
      (SOUL.md still broken). The TOOLS.md change must be queued and
      processed after SOUL.md is fixed. When SOUL.md is fixed and
      recompilation runs, it must include both the SOUL.md fix and the
      TOOLS.md change. If the TOOLS.md change is lost, it must be
      re-detected on the next file watcher sweep.
    spec_impact: "CL-14 queued changes during ERROR — accumulate pending changes; process all on recovery recompile"
    pitfall: null

  - id: F10
    severity: major
    description: >
      If the system starts up with a structural error already present (e.g.,
      the developer corrupted SOUL.md and then restarted claws serve), the
      startup health check must handle this gracefully. If no last-good-IR
      exists (first boot with corrupted file), the system enters ERROR
      state with no cached IR to serve. All endpoints return 503. The
      health endpoint must clearly state "no compilation possible — fix
      SOUL.md line 1." A cold start with a structural error must not
      crash the server.
    spec_impact: "CL-06 startup with error — ERROR state; 503 if no last-good-IR; health endpoint shows actionable fix"
    pitfall: null

  - id: F11
    severity: warning
    description: >
      The parse error message surfaced to the admin must be sanitized.
      The raw parser error may include file system paths, internal module
      names, or stack frames. The error builder must extract the
      user-actionable portion (file name, line, column, expected vs found)
      and discard internal details. The oc_path format should be used for
      the file reference (oc://SOUL.md, not C:\workspace\SOUL.md or
      /home/user/.claws/workspace/SOUL.md).
    spec_impact: "CL-10 error sanitization — user-actionable info only; oc_path format; no internal paths or stack traces"
    pitfall: null

  - id: F12
    severity: warning
    description: >
      If multiple files have structural errors simultaneously (e.g., both
      SOUL.md and TOOLS.md are corrupted), the error response must list
      ALL parse errors, not just the first. The compiler may stop at the
      first error (fail-fast) or attempt all files (fail-slow). Fail-slow
      is preferred because it lets the admin fix all errors in one pass.
      The status endpoint should list all structural errors with their
      file, line, and column information.
    spec_impact: "CL-06 multi-file errors — fail-slow compilation; list all parse errors in status; admin fixes all at once"
    pitfall: null

  - id: F13
    severity: note
    description: >
      The ERROR state should track how long the workspace has been in
      error. If ERROR persists for more than 5 minutes, the system should
      emit a reminder SSE event ("workspace:error_persistent") to nudge
      the admin. If ERROR persists for more than 30 minutes, the system
      should escalate by writing to the audit log with severity "alert."
      This prevents situations where a corrupted file goes unnoticed for
      hours because the developer switched context and forgot.
    spec_impact: "CL-10 error persistence — 5m reminder SSE; 30m audit alert; prevents unnoticed long-duration errors"
    pitfall: null

name: S30-concurrent-multi-tab
series: cap-integration
version: 2
specs: [CL-10, CL-06, CL-03]
description: >
  Validates that two CAP tabs sending PATCHes simultaneously (one to TOOLS.md,
  one to SOUL.md) are handled correctly. The compilation queue serializes
  compilations, both edits land, and compilations are coalesced into a single
  recompile when possible. ETag on the second response reflects both changes.
  FIFO ordering, dirty set accumulation, deadlock prevention, correct governance
  results per PATCH, and SSE events for both edits are all tested.

expect:
  concurrent_patches:
    patch_a:
      endpoint: "PATCH /api/oc/TOOLS.md#Tools"
      payload: "add tool: 'new-tool'"
    patch_b:
      endpoint: "PATCH /api/oc/SOUL.md#Boundaries"
      payload: "add deny rule: 'No deletions'"
    both_land: true
    compilation_coalesced: true
    single_recompile: true
  ordering:
    fifo: true
    patch_a_response_before_patch_b: not_guaranteed
    both_get_governance_result: true
  etag:
    after_both_patches:
      reflects_both_changes: true
      compilation_id: same_for_both
  sse:
    events_emitted: 2
    types: [OC_FILE_UPDATED, OC_FILE_UPDATED]
    compilation_event: 1
  deadlock:
    prevented: true
    mechanism: single_compilation_queue

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  Two CAP settings tabs are open. Tab A sends PATCH /api/oc/TOOLS.md#Tools to
  add a new tool. Tab B sends PATCH /api/oc/SOUL.md#Boundaries to add a deny
  rule. Both PATCHes arrive within milliseconds of each other. The system must:
  (1) write both files (TOOLS.md and SOUL.md), (2) queue a compilation that
  covers both changes (coalesced, not two separate compilations), (3) return
  a governance result to both tabs that reflects the compilation including both
  changes, (4) ensure the ETag on both responses uses the same compilation_id,
  (5) emit SSE events for both file changes and one compilation event, (6)
  prevent deadlocks when both writes contend for the compilation queue. The
  challenge is concurrency: two writes must not corrupt each other, compilation
  must see both, and responses must be consistent.

findings:
  - id: F01
    severity: critical
    description: >
      File writes must be serialized or use file-level locking to prevent
      corruption. If PATCH A writes TOOLS.md while PATCH B writes SOUL.md,
      there is no contention (different files). But if two PATCHes target
      the same file simultaneously (e.g. two edits to TOOLS.md), one write
      may overwrite the other. Per-file write locks ensure that concurrent
      writes to the same file are serialized. Different files can be written
      in parallel.
    spec_impact: "CL-10 concurrent writes — per-file write lock; same-file PATCHes serialized; different-file PATCHes parallel"
    pitfall: null

  - id: F02
    severity: critical
    description: >
      Compilation coalescing must accumulate a dirty set. When PATCH A
      completes its write, it adds TOOLS.md to the dirty set. When PATCH B
      completes its write, it adds SOUL.md. The compilation queue picks up
      the dirty set and compiles all dirty files in one pass. If coalescing
      is not implemented, each PATCH triggers its own compilation and the
      second compilation may start before the first finishes, causing
      inconsistent IR. A single compilation queue with dirty-set accumulation
      prevents this.
    spec_impact: "CL-06 compilation queue — dirty-set accumulation; single coalesced recompile for concurrent writes"
    pitfall: null

  - id: F03
    severity: critical
    description: >
      Both PATCH responses must include the governance result from the
      compilation that includes BOTH changes. If PATCH A returns before
      the compilation (which waits for PATCH B's write), its response
      has no governance context. The system must either: (a) hold PATCH A's
      response until compilation completes (higher latency but consistent),
      or (b) return immediately with governance_context: pending and emit
      an SSE event when compilation finishes. The contract must specify
      which strategy is used.
    spec_impact: "CL-10 PATCH response timing — define sync (hold until compile) vs async (return with pending, SSE on complete) strategy"
    pitfall: null

  - id: F04
    severity: critical
    description: >
      The ETag on both PATCH responses must use the same compilation_id if
      both are served after the coalesced compilation. If PATCH A gets
      compilation_id: 42 and PATCH B gets compilation_id: 43 (from a
      non-coalesced second compile), the tabs have inconsistent state. The
      ETag must be tied to the compilation that includes both changes. This
      requires both responses to wait for the same compilation.
    spec_impact: "CL-10 ETag consistency — both concurrent PATCH responses reference same compilation_id after coalesced compile"
    pitfall: null

  - id: F05
    severity: major
    description: >
      FIFO ordering of PATCHes must be preserved for same-file writes.
      If two PATCHes to TOOLS.md arrive at T1 and T2 (T1 < T2), the T1
      write must be applied first. If the system processes them out of
      order, the T1 edit may overwrite the T2 edit (last-write-wins) or
      the T2 edit may be applied to pre-T1 content (lost update). The
      per-file write lock must enforce FIFO. Cross-file ordering does not
      matter (TOOLS.md and SOUL.md are independent).
    spec_impact: "CL-10 write ordering — FIFO per-file via write lock; cross-file ordering not required"
    pitfall: null

  - id: F06
    severity: major
    description: >
      Deadlock prevention is critical when multiple PATCHes contend for
      the compilation queue. A deadlock scenario: PATCH A holds the
      TOOLS.md write lock and waits for the compilation queue. PATCH B
      holds the SOUL.md write lock and waits for the compilation queue.
      The compilation queue waits for both writes to complete. This is
      not a true deadlock (no circular dependency) but a livelock if the
      compilation queue blocks on a lock. The design must ensure writes
      complete independently and add to the dirty set without waiting for
      compilation. Compilation runs asynchronously on the dirty set.
    spec_impact: "CL-10 deadlock prevention — writes complete independently; dirty set updated lock-free; compilation runs async on dirty set"
    pitfall: null

  - id: F07
    severity: major
    description: >
      SSE events must be emitted for each file change individually (two
      OC_FILE_UPDATED events) and one COMPILATION_COMPLETE event after
      the coalesced compile. If only the compilation event is emitted,
      connected tabs do not know which specific files changed until they
      re-fetch. The per-file events should be emitted as soon as each
      write completes, before compilation. The compilation event is emitted
      after the compile finishes. This gives tabs early visibility into
      changes.
    spec_impact: "CL-10 SSE events — per-file OC_FILE_UPDATED on write complete; COMPILATION_COMPLETE after compile; ordered by causality"
    pitfall: null

  - id: F08
    severity: major
    description: >
      If PATCH A's write succeeds but PATCH B's write fails (e.g. schema
      validation error), only TOOLS.md is in the dirty set. The coalesced
      compilation runs on TOOLS.md only. PATCH B receives its error response
      immediately. PATCH A's response includes governance from a compilation
      that only covers TOOLS.md. This is correct behavior, but the system
      must ensure that a failed write does NOT add to the dirty set, and
      the compilation does not wait for writes that already failed.
    spec_impact: "CL-06 dirty set — failed writes excluded; compilation proceeds on successful writes only; no waiting for failed PATCHes"
    pitfall: null

  - id: F09
    severity: warning
    description: >
      The compilation queue must have a coalescing window (e.g. 100ms).
      Writes that arrive within the window are batched into one compilation.
      Without a window, each write triggers an immediate compilation and
      there is no coalescing. With too large a window, PATCH response
      latency increases unnecessarily. The window should be configurable
      with a sensible default. The trade-off is latency vs compilation
      count.
    spec_impact: "CL-06 compilation coalescing — configurable window (default 100ms); trade latency vs compilation count"
    pitfall: null

  - id: F10
    severity: warning
    description: >
      If the coalesced compilation fails (e.g. the combined state of
      TOOLS.md + new SOUL.md deny rule creates a GovernanceIR conflict),
      both tabs must be notified. The compilation error should reference
      which files contributed to the conflict. If only one file caused the
      error, the other tab should not be penalized -- the system should
      attempt a partial compilation excluding the problematic file and
      notify the offending tab of the issue.
    spec_impact: "CL-06 coalesced compilation failure — per-file error attribution; partial compilation for non-conflicting files"
    pitfall: null

  - id: F11
    severity: warning
    description: >
      Concurrent GETs arriving during the compilation window should receive
      the pre-compilation IR (consistent snapshot) with a header indicating
      compilation is in progress (X-OC-Compilation: pending). They should NOT
      wait for the compilation to complete. This ensures read latency is not
      affected by write-triggered compilations. The next GET after compilation
      completes will see the updated IR.
    spec_impact: "CL-10 concurrent GET during compile — serve pre-compilation IR with X-OC-Compilation: pending header; no read blocking"
    pitfall: null

  - id: F12
    severity: note
    description: >
      Metrics for compilation coalescing should track: coalesce_ratio
      (compilations saved / writes received), average_dirty_set_size,
      and average_coalesce_window_utilization. If the coalesce ratio is
      low (each write triggers its own compilation), the window may be
      too small. If the dirty set is consistently 1, concurrent writes
      are rare and coalescing overhead is wasted. These metrics help tune
      the coalescing window.
    spec_impact: "CL-06 metrics — compilation coalescing: coalesce_ratio, dirty_set_size, window_utilization via metrics endpoint"
    pitfall: null

name: S14-audit-query
series: cap-integration
version: 1
specs: [CL-10]
description: >
  Validates that GET /api/audit returns the governance audit trail from
  @bic/audit-chain as a queryable, hash-chained event log. Events
  are linked by prevHash references forming a tamper-evident chain.
  The API supports filtering by category and userId, pagination via
  cursor, and export to SARIF format for integration with security
  tooling. The Companion App audit panel renders this as a filterable
  timeline.

expect:
  get_audit:
    endpoint: "GET /api/audit"
    response_shape:
      events_is_array: true
      each_event_has:
        - id
        - timestamp
        - category
        - userId
        - description
        - hash
        - prevHash
      first_event_prevHash: null
      chain_integrity: "hash[n].prevHash == hash[n-1].hash"
  filtering:
    by_category:
      endpoint: "GET /api/audit?category=trust-escalation"
      result: "only events with category == trust-escalation"
    by_userId:
      endpoint: "GET /api/audit?userId=alice@contoso.com"
      result: "only events from that user"
    combined:
      endpoint: "GET /api/audit?category=deny-rule-removal&userId=bob@contoso.com"
      result: "intersection of both filters"
  pagination:
    endpoint: "GET /api/audit?cursor=<eventId>&limit=50"
    result:
      events_count_lte: 50
      nextCursor_present_when: "more events exist"
  sarif_export:
    endpoint: "GET /api/audit?format=sarif"
    result:
      content_type: "application/sarif+json"
      sarif_version: "2.1.0"
      runs_array_present: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A compliance officer opens the Companion App audit panel and queries
  GET /api/audit?category=trust-escalation&limit=20. The server reads
  the audit chain from @bic/audit-chain, filters to trust-escalation
  events, and returns the 20 most recent with hash chain references. The
  officer verifies chain integrity by checking that each event's prevHash
  matches the preceding event's hash. They then export the full chain as
  SARIF for ingestion into their security information system. The audit
  chain must be append-only — events are never deleted or modified.

findings:
  - id: F01
    severity: major
    description: >
      Query performance on large chains: the audit chain is append-only
      and grows without bound. A workspace active for months could have
      tens of thousands of events. Reading the entire chain from
      @bic/audit-chain and filtering in memory does not scale. The
      audit-chain package must support indexed queries (by category,
      userId, timestamp range) or the claws-serve layer must maintain
      a secondary index (SQLite or similar) synced from the chain.
    spec_impact: "CL-10 /api/audit — indexed query support, not full-chain scan"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Chain integrity verification on every read is expensive. Computing
      hashes for thousands of events per request adds latency. The API
      should verify integrity periodically (e.g., on server startup and
      every N minutes) and cache the verification result. Individual
      GET requests return the cached integrity status rather than
      re-verifying. A `?verify=true` parameter forces fresh verification
      for compliance spot-checks.
    spec_impact: "CL-10 /api/audit — cached integrity verification, on-demand verify param"
    pitfall: null

  - id: F03
    severity: major
    description: >
      Retention policy enforcement: some organizations require audit logs
      to be retained for N years, others require deletion after N days
      (GDPR right to erasure). An append-only chain conflicts with
      deletion requirements. The chain must support tombstone markers
      (event replaced with deletion record that preserves hash chain)
      rather than true deletion, so chain integrity survives retention
      enforcement.
    spec_impact: "CL-10 audit-chain — tombstone deletion preserving hash chain integrity"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      SARIF export mapping: SARIF (Static Analysis Results Interchange
      Format) is designed for static analysis findings, not audit events.
      Mapping audit events to SARIF requires convention: each event maps
      to a SARIF `result`, the category maps to `ruleId`, the description
      maps to `message`. The mapping must be documented and consistent
      so security tools can write reliable parsers.
    spec_impact: "CL-10 SARIF export — documented mapping convention for audit-to-SARIF"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      Filtered queries break chain verification. If a user requests
      ?category=trust-escalation, the returned events are a subset of the
      chain. The prevHash references point to events NOT in the response.
      The client cannot verify chain integrity on a filtered result set.
      The response should include a `chainVerifiedAt` timestamp from the
      last full verification, and filtered results should note that
      per-event prevHash references are to the full chain, not the
      filtered subset.
    spec_impact: "CL-10 /api/audit — chainVerifiedAt metadata on filtered responses"
    pitfall: null

  - id: F06
    severity: warning
    description: >
      The hash algorithm must be specified in the response (e.g.,
      `hashAlgorithm: 'sha256'`). If the algorithm changes in a future
      version of audit-chain, clients verifying integrity need to know
      which algorithm to use. A mixed chain (old events with sha256, new
      with sha3-256) must include the algorithm per event or per chain
      segment.
    spec_impact: "CL-10 audit event schema — hashAlgorithm field for forward compatibility"
    pitfall: null

  - id: F07
    severity: note
    description: >
      Audit events may contain PII (userId, manager email, edited
      content). The SARIF export and API responses must respect the
      caller's authorization level. A read-only user should see event
      metadata but not PII fields. The API needs role-based field
      filtering: full events for compliance officers, redacted events
      for regular users.
    spec_impact: "CL-10 /api/audit — role-based field redaction for PII protection"
    pitfall: null

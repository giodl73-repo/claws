name: S02-diamond-dependency-dedup
series: cross-package
version: 1
specs: [CL-08]
description: >
  Validates that diamond dependencies across the 17-package graph resolve to
  a single copy of each shared package. When @bic/claws-sdk and
  @bic/claws-sdk both depend on @craftworks/crypto (directly or
  transitively), npm must deduplicate to one installed copy. Duplicate module
  instances break instanceof checks, corrupt shared audit chains, and double
  memory usage. This scenario tests the most critical diamond: crypto.

expect:
  npm_ls:
    crypto_instances: 1
    forma_instances: 1
    governance_instances: 1
    deduplication: "complete"
  instanceof_check:
    audit_chain_cross_layer: true
    workspace_ast_cross_layer: true
  memory:
    no_duplicate_registries: true

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  Install @bic/claws-sdk (which depends on @craftworks/crypto, @craftworks/forma,
  @craftworks/workspace, @craftworks/codegen, @craftworks/emit-oc, @craftworks/emit-cc)
  alongside @bic/claws-sdk (which depends on @bic/claws-sdk plus additional
  Layer 1 blocks including @craftworks/governance, @craftworks/context, etc.).
  The diamond occurs because claws-sdk depends on @bic/claws-sdk AND directly on
  some of the same Layer 1 blocks that @bic/claws-sdk also depends on.
  Run npm ls --all and verify that each @craftworks/* package appears exactly once
  in the resolved tree. Then run an instanceof check: create an AuditChain in
  @craftworks/crypto, pass it to @bic/claws-sdk, and verify that
  chain instanceof AuditChain returns true (proves single module instance).

findings:
  - id: F01
    severity: major
    description: >
      @bic/claws-sdk pins Layer 1 dependencies to exact versions (CL-08 line
      608-621). @bic/claws-sdk also pins its Layer 1 dependencies to
      exact versions (line 630). If claws-sdk pins @craftworks/crypto@1.1.0
      while @bic/claws-sdk pins @craftworks/crypto@1.0.0, npm cannot deduplicate
      and installs two copies. The AuditChain created by crypto@1.0.0 fails
      instanceof against crypto@1.1.0's class, breaking cross-layer audit chain
      passing. Both layers must coordinate version pins via @craftworks/platform
      manifest.
    spec_impact: "CL-08 API stability — platform manifest must be the single source of truth for version pins across layers"
    pitfall: null

  - id: F02
    severity: major
    description: >
      @craftworks/forma depends on @craftworks/crypto for IR hashing. @bic/claws-sdk
      depends on both @craftworks/forma and @craftworks/crypto directly. This creates
      a diamond: compiler -> forma -> crypto AND compiler -> crypto. If forma declares
      crypto as a peerDependency (recommended in forma S01-F03), but compiler declares
      it as a regular dependency, npm's hoisting algorithm may install crypto at
      different tree levels depending on install order. The fix is for all packages
      to use consistent dependency types (peer vs regular) for shared dependencies.
    spec_impact: "CL-08 dependency types — all packages must use consistent dep type (peer vs regular) for shared packages"
    pitfall: null

  - id: F03
    severity: major
    description: >
      Singleton registries (EmitRegistry in @craftworks/codegen, RuleRegistry in
      @bic/claws-sdk) store global state in module-level variables. If codegen is
      duplicated, EmitRegistry.register() in one copy does not affect the other.
      @bic/claws-sdk registers emit-oc and emit-cc emitters. If @bic/claws-sdk
      gets a different codegen instance, its additional emitter registrations
      (emit-cursor, emit-copilot, etc.) land in a separate registry. The compile
      orchestrator then sees only a subset of registered emitters depending on
      which codegen instance it resolves.
    spec_impact: "CL-08 @craftworks/codegen — EmitRegistry must detect and fail on duplicate instances"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      TypeScript declaration files (.d.ts) carry module identity via their
      resolved path. If npm installs two copies of @craftworks/crypto at
      different tree levels, TypeScript sees two distinct AuditChain types
      that are structurally identical but nominally different. Consumers that
      pass an AuditChain from one layer to another get TS2345 "Argument of
      type 'AuditChain' is not assignable to parameter of type 'AuditChain'"
      errors. This is a compile-time failure that only surfaces in consumer
      projects, not in the packages' own test suites.
    spec_impact: "CL-08 testing strategy — cross-layer type compatibility tests required in CI"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      npm's hoisting algorithm behavior differs between npm 7, 8, 9, and 10.
      Older npm versions are more aggressive with nesting and less likely to
      deduplicate when version ranges differ slightly. The @craftworks/platform
      manifest must specify a minimum npm version for correct deduplication.
      Without this, enterprise customers on older npm versions silently get
      duplicate instances that pass all tests but corrupt runtime state.
    spec_impact: "CL-08 @craftworks/platform — manifest must declare minimum npm version for deduplication guarantee"
    pitfall: null

  - id: F06
    severity: warning
    description: >
      pnpm and yarn handle deduplication differently than npm. pnpm uses a
      content-addressable store with strict isolation — deduplication is
      structural, not hoisting-based. yarn plug'n'play eliminates node_modules
      entirely. The diamond dedup guarantee must be tested across all three
      package managers since CL-08 does not restrict which one consumers use.
      A diamond that deduplicates under npm may not deduplicate under pnpm
      strict mode.
    spec_impact: "CL-08 testing strategy — dedup tests must cover npm, pnpm, and yarn"
    pitfall: null

  - id: F07
    severity: warning
    description: >
      @craftworks/governance depends on @craftworks/crypto (CL-08 line 189).
      @craftworks/execution depends on @craftworks/governance (line 249). Both
      are used by @bic/claws-sdk. The transitive diamond (claws-sdk ->
      execution -> governance -> crypto, AND claws-sdk -> compiler ->
      crypto) means crypto appears as a transitive dependency through two
      entirely different paths. If any intermediate package re-exports crypto
      types under an alias, the two paths diverge at the type level even if
      the runtime instance is deduplicated.
    spec_impact: "CL-08 dependency rules — no type aliasing of shared package exports across layers"
    pitfall: null

  - id: F08
    severity: note
    description: >
      The @craftworks/platform manifest (CL-08 line 302-304) declares
      tested-together versions. A CI job should install all 21 packages at
      their platform-manifest-declared versions and verify zero duplication
      via npm ls --all | grep "deduped". If any package is not deduped, the
      manifest version combination is invalid and must not be published.
    spec_impact: "CL-08 @craftworks/platform — manifest CI must verify zero duplication as a publish gate"
    pitfall: null

  - id: F09
    severity: note
    description: >
      Bundlers (esbuild, webpack, rollup) used by consumer projects may
      tree-shake and bundle packages differently than Node.js resolution.
      A diamond that deduplicates at the npm level may produce two copies
      in a bundle if the bundler does not follow the same hoisting rules.
      The scenario should include a bundler smoke test: esbuild a consumer
      that imports from both @bic/claws-sdk and @bic/claws-sdk,
      verify the output contains one copy of crypto module code.
    spec_impact: "CL-08 testing strategy — bundler dedup smoke test alongside npm dedup test"
    pitfall: null

  - id: F10
    severity: note
    description: >
      When diamond deduplication works correctly at the npm level, all
      singleton registries operate on a single instance. But if a consumer
      uses a monorepo workspace (turborepo, nx) with linked packages, the
      workspace links bypass npm deduplication entirely. Each workspace
      package gets its own node_modules symlink tree. The scenario must
      distinguish between "npm install from registry" (dedup applies) and
      "monorepo workspace link" (dedup does not apply) and document both
      paths.
    spec_impact: "CL-08 testing strategy — document monorepo vs registry install dedup differences"
    pitfall: null

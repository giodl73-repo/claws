description: |
  Add native OpenClaw support for curated skill/plugin catalog feeds.
  OpenClaw consumes explicit feed artifacts through normal config, search,
  install handoff, policy conformance, and lifecycle tooling. ClawHub-native
  hosted feeds and external enterprise feed producers can emit the same feed
  contract; OpenClaw should not become a feed-hosting system.


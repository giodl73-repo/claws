    title: "Scout catalog publishing lifecycle"
    scope: |
      Add the producer/admin motion that sits above feed files: submit/import
      candidates from source systems, validate normalized metadata, approve,
      reject, deny, pin, publish approved tenant feeds, and detect updates.
      Scout does not upload packages to source systems; it manages catalog review
      state after ClawHub, MOS3, GitHub, npm, or internal registries already have
      package records.

reviewLearnings:
  - Keep OpenClaw as a feed consumer, not a feed host.
  - Keep source management config-only; do not combine it with publisher build/diff.
  - Treat ClawHub-native feeds as shared root feeds that enterprises can layer over.
  - Use explicit search/install rollout paths before changing default ClawHub search.
  - Diff feed entries by catalog-visible payload, not only metadata.
  - Canonicalize build output before hashing so raw integrity stays stable.
  - Normalize top-level build strings before attestation so build output validates.
  - Keep Policy checks config conformance only; do not fetch feed documents in Policy.
  - Separate source package publishing from Scout catalog publishing: source
    systems own package upload; Scout owns candidate review and approved feed
    materialization.


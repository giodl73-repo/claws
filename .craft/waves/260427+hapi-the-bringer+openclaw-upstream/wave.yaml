# Checkpoint structure — 5 checkpoints, 12 pulses, 7 upstream PRs + scope-flip + acceptance.
# (Restructured 2026-04-27 from "yes lets do it" → "lets make B PR 2" sign-off,
# adding PR-2 oc:// URI scheme extension + reshaping checkpoints to pair small
# surgical PRs with heavy package PRs at every wave.)
checkpoints:
  cp-1:
    slug: prep-artifacts
    description: |
      Spec amendment (UG-upstream v0.2 + URI scheme extension §X), bot-
      preempt-checklist guide, adapter-audits guide, post-merge-verification
      runbook. Adapter audits resolved to "OK to land" verdict. Dependency
      gate for every subsequent checkpoint — no PR opens until cp-1 closes.
    plans: [claws-openclaw-upstream]
    pulses: [01, 02, 03]
    addresses_headlines: [H6]
  cp-2:
    slug: wave-a-workspace-foothold
    description: |
      PR-1 (@openclaw/workspace + replaceConfigFile lossless conversion +
      diagnostic shape extended to accept oc:// URIs) + PR-2 (oc:// scheme
      extended to address runtime config oc://config/...). Two PRs open
      simultaneously, conceptually independent. Workspace earns its keep
      THREE ways in this wave: /ast replaces JSON.stringify; /path becomes
      the diagnostic vocabulary; /canonicalize underwrites cross-OS hashing.
    plans: [claws-openclaw-upstream]
    pulses: [04, 05]
    addresses_headlines: [H1]
    depends_on: [cp-1]
  cp-3:
    slug: wave-b-small-surgical-and-governance
    description: |
      PR-3 (OC-4 stripFrontMatter raw-preserve, ~1 line) + PR-4
      (@openclaw/guardrails). Surgical small + heavy big paired for parallel
      review. Guardrails carries the audit-stream adapter audit; audit
      entries cite oc:// URIs natively.
    plans: [claws-openclaw-upstream]
    pulses: [06, 07]
    addresses_headlines: [H2, H5-partial]
    depends_on: [cp-2]
  cp-4:
    slug: wave-c-merger-and-generator
    description: |
      PR-5 (OC-7 requireApproval conjunctive merger, ~5 lines + try/catch +
      Swift model regen) + PR-6 (@openclaw/policy + openclaw policy 9-verb
      subcommand group). Same small-paired-with-big pattern. Codemod gate
      validates internal consumers compile against trunk's widened field.
    plans: [claws-openclaw-upstream]
    pulses: [08, 09]
    addresses_headlines: [H3, H5]
    depends_on: [cp-3]
  cp-5:
    slug: wave-d-registry-and-closeout
    description: |
      PR-7 (@openclaw/snap + openclaw snap 11-verb subcommand group + HTTP
      server with /v1/resolve?uri=oc://... accepting both workspace and config
      URIs) + scope-flip internal rename + acceptance fixtures materialization.
      Final checkpoint. Closeout follows.
    plans: [claws-openclaw-upstream]
    pulses: [10, 11, 12]
    addresses_headlines: [H4]
    depends_on: [cp-4]
    final: true

# Operating constraints — bake into every PR and every review.
constraints:
  upstream_repo: github.com/openclaw/openclaw
  upstream_head_pinned: 5e8cc1d9c
  upstream_pr_cap: 10  # auto-close if exceeded by author
  pr_open_concurrency: 2  # match upstream's two-open-at-a-time culture
  reviewer_trio: [greptile-apps[bot], copilot-pull-request-reviewer[bot], chatgpt-codex-connector[bot]]
  baseline_hash_file: docs/.generated/plugin-sdk-api-baseline.sha256
  sdk_overview_table: docs/sdk-overview.md
  swift_models_files:
    - apps/macos/Sources/OpenClawProtocol/GatewayModels.swift
    - apps/shared/OpenClawKit/Sources/OpenClawProtocol/GatewayModels.swift
  changelog_rule: "new entries appended to END of target section, not mid-section"
  authority_doc: CLAUDE.md
  auto_close_risks:
    - "r:third-party-extension"
    - "r:skill"
  auto_close_mitigation: "Every PR description leads with WHY governance must be core, not ClawHub extension"


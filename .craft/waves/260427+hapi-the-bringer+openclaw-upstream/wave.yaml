    status: ready # cp-1 closed; cp-2 dispatch unblocked 2026-04-28
    description: |
      Single upstream PR after the 2026-04-28 merge of former PR-2 into
      PR-1: PR-1 ships @openclaw/workspace + replaceConfigFile lossless
      conversion + dual oc:// URI scheme (workspace + config) + doctor
      migration emit + 13-code JSONC lint surface. Workspace earns its
      keep FOUR ways: /ast/jsonc replaces JSON.stringify; /lint closes
      27+ real config-failure issues; /path becomes the dual diagnostic
      vocabulary (workspace + config); /canonicalize underwrites cross-OS
      hashing.
    plans: [claws-openclaw-upstream, claws-workspace-lint]
    pulses: [04]
    addresses_headlines: [H1]
    depends_on: [cp-1]
    dispatch_plan:
      ordering: single # one upstream PR; following sub-waves pair-up
      sequence:
        - step: 0a
          action: |
            Integration: ensure GitHub fork exists at github.com/giodl73-repo/openclaw
            (`gh repo fork openclaw/openclaw --clone=false --org=`, or skip if
            already forked); add as `fork` remote in C:\src\openclaw-core
            (`git remote add fork https://github.com/giodl73-repo/openclaw.git`,
            or update if already set); cut feature branch
            `feat/openclaw-workspace-lossless-config` from current trunk; apply
            PR-1 patches (config/io.ts:1381+2082, DiagnosticLocation
            discriminated union, doctor migration emit at
            doctor-legacy-config.migrations.ts + doctor-config-flow.ts, copy
            packages/openclaw-workspace from claws); commit; push to fork
            (`git push fork feat/openclaw-workspace-lossless-config`).
            Note: user is a maintainer of openclaw/openclaw and could push
            directly, but is using the standard fork-and-PR flow for review
            discipline + bot-trio scrutiny + dogfooding the wave's tooling.
          gate: "pnpm install + build clean against trunk; existing src/config/io.test.ts + src/commands/doctor-legacy-config.migrations.test.ts + src/commands/doctor-config-flow.test.ts pass UNCHANGED; new tests added per pulse 04 TDD section pass; branch pushed to fork (not upstream)"
        - step: 0b
          action: "Perf bench: write tests/perf/bench.test.ts with 8 fixtures (10K/100K/1MB plain JSON + 10K/100K/1MB JSONC + lint-pass-on-100K with/without schema); 100 iterations after warmup; capture p50/p95/p99"
          gate: "plain JSON parity-or-faster vs JSON.stringify (short-circuit verified); JSONC ≤2× stringify; 50ms ceiling on 1MB; record in tests/perf/RESULTS.md and embed in PR-1 description"
        - step: 1
          action: "Refresh openclaw-core to latest trunk; verify HEAD past dd643c82b doesn't break our citations"
          gate: "git -C C:\\src\\openclaw-core fetch && verify hook-types.ts:936-942 still defines PluginHookRegistration with same shape (citation rot check per adapter-audits §5)"
        - step: 2
          action: "Run regen-lint-evidence.ts; print live counts; manually update EVIDENCE.md + PR-1 description if material drift"
          gate: "advisory only — author judgment"
        - step: 3
          action: "Run scan-pr-body.sh against pr-drafts/PR-1.md"
          gate: "exit 0 — NEVER-SAFE phrases absent"
        - step: 4
          action: |
            Pulse 04: open PR-1 at github.com/openclaw/openclaw via
            `gh pr create --repo openclaw/openclaw
              --head giodl73-repo:feat/openclaw-workspace-lossless-config
              --base main
              --title "feat: add @openclaw/workspace + lossless replaceConfigFile + lint surface + oc://config URI vocabulary"
              --body-file pr-drafts/PR-1.md`.
            User has maintainer access but is following standard fork-and-PR
            flow (head = fork, base = upstream main).
          gate: "PR opens; CLA bot (if any) green; greptile + copilot + chatgpt-codex bot trio assigned automatically"
        - step: 5
          action: "Watch reviewer comments; respond per bot-preempt-checklist §5 patterns"
          gate: "median <4h merge per upstream culture; 1 round of changes acceptable"
        - step: 6
          action: "Once PR-1 merges: run post-merge-verification §3.1 (H1 validators) against trunk"
          gate: "all H1 validators GREEN; record merge SHA + baseline-hash post in docs/upstream/CHANGELOG.md per §6"
      caveats:
        - "If openclaw-core trunk has drifted significantly (e.g., new fields on PluginHookRegistration), STOP and re-run cp-1 adapter-audits.md before opening PR-1 (per §5 re-audit cadence)"
        - "If scan-pr-body.sh exits non-zero, fix the NEVER-SAFE phrase before push"
        - "If perf bench exceeds 50ms on 1MB or fails parity on plain JSON, STOP and redesign before pushing — Greptile auto-rejects unverified perf claims"
        - "If first reviewer comment within 30 min flags r:third-party-extension, IMMEDIATELY edit PR description and reply citing the carve-out paragraph"
      hard_gates:
        - "F-38 HC-BLOCK closed (adapter-audits §3 audit-stream wire-shape complete) — VERIFIED at cp-1 close"
        - "F-45 HC-WARN closed (adapter-audits §4 runtime-gated enforcement documented) — VERIFIED at cp-1 close"
        - "lint test suite green (47/47) — VERIFIED at cp-1 close"
        - "Integration patches build + existing upstream tests pass — VERIFIED at step 0a"
        - "Perf bench within budget — VERIFIED at step 0b"
        - "scan-pr-body.sh exit 0 on PR-1 description — VERIFIED IMMEDIATELY before push"
  cp-3:
    slug: wave-b-small-surgical-and-governance
    description: |
      PR-2 (OC-4 stripFrontMatter raw-preserve, ~1 line) + PR-3

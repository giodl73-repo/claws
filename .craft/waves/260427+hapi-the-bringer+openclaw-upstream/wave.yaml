# Branch cohabitation merge strategy (R1-consolidated finding N3).
# Hapi shares feature/isis-the-weaver with the in-flight Isis lobster-foundation
# wave. To prevent late delivery-stage rebase conflicts, the provisional plan is:
branch_cohabitation:
  provisional_merge_order:
    1: "Isis lobster-foundation (active, ahead in implementation, expected to merge first)"
    2: "Hapi openclaw-upstream (this wave; will rebase if Isis merges first)"
  rationale: |
    Isis is several checkpoints into implementation with 43 pulses already
    decomposed; Hapi is at kickoff with 4 provisional checkpoints. Isis likely
    completes first. Hapi commits will rebase on top of post-Isis-merge main.
  rebase_strategy: |
    - Hapi's spec/guide/scenario writes are wave-directory-scoped and won't
      conflict with Isis's implementation (different package trees).
    - Real conflict risk is only in shared root files: PLANS.md, WAVES.md,
      CODEBASE.md, ATOMS.md, and the docs/upstream/* tree.
    - Hapi will use git ours/theirs strategy on those at rebase time, then
      manually re-apply Hapi's wave/plan entries.
  pre_delivery_checkpoint:
    description: |
      Before Hapi advances to delivery stage, verify rebase order is still
      sound (run `git log feature/isis-the-weaver..main --oneline` to see
      what's already on main; if Isis already merged, rebase Hapi onto main).
    blocking: true

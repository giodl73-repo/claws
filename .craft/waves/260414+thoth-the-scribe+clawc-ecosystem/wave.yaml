# Dual-coverage CI gate (THOTH-INTEGRATION-COVERAGE)
# Two vitest runs per checkpoint: unit then integration.
# Both must pass before checkpoint advances.
coverage:
  unit:
    # Per-file thresholds — existing bar from Anubis
    statements: 95
    branches: 90
    functions: 95
    lines: 95
    scope: "*.unit.test.ts"
  integration:
    # Whole-package thresholds — new for Thoth
    # Baseline: 76% stmts / 59% branches (Anubis exit)
    # Target: close gap so integration tests alone prove the system works
    statements: 85
    branches: 70
    functions: 80
    lines: 85
    scope: "*.integration.test.ts + *.e2e.test.ts"
  enforcement: per-checkpoint-gate
  notes: >
    Unit run validates per-file 95/90/95/95. Integration run validates
    whole-package 85/70/80/85. Integration targets are aspirational for
    CP-1 (baseline 76/59), mandatory by CP-3. Each gate pulse must run
    both: `vitest run --project unit --coverage` then
    `vitest run --project integration --coverage`.


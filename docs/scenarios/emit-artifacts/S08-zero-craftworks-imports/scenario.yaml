name: S08-zero-craftworks-imports
series: emit-artifacts
version: 1
specs: [CL-04]
description: >
  Validates the OC developer test: all generated code must have zero
  @craftworks/ imports. Generated artifacts (SKILL.md, index.ts,
  exec-approvals.json, lobster.compiled.yaml) must look like code an
  OC developer would write themselves, with no internal Craftworks references.

expect:
  artifacts:
    - type: plugin
      path: plugins/claws-governance/index.ts
      valid: true
      craftworks_imports: 0
    - type: skill
      path: skills/claws-governance/SKILL.md
      valid: true
      craftworks_references: 0
    - type: exec-approvals
      path: exec-approvals.json
      valid: true
      craftworks_references: 0
  plugin_hooks: null
  skill_content:
    craftworks_references: 0
  approvals: null

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  All 4 generated artifacts are scanned for @craftworks/ import statements,
  Craftworks-specific type references, and internal SDK references. The
  generated index.ts must import only from @openclaw/* or @claws/* packages
  (the contribution tiers). The SKILL.md must not mention Craftworks,
  compiler-sdk, or internal toolchain names. exec-approvals.json must use
  OC-native field names.

findings:
  - id: F01
    severity: major
    description: >
      The three-tier import hierarchy is: @openclaw/* (contributed, free),
      @claws/* (shared libraries, commercial), @craftworks/* (internal only,
      never in output). If the code generator accidentally includes a
      craftworks-sdk type in a generated TypeScript interface, the import
      leaks. Type-only imports might not appear in the JS output but do
      appear in TS source.
    spec_impact: "CL-04 EMIT — import scanning must check TS source, not JS"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Error messages in the generated code (blockReason strings, log messages)
      must not reference internal names. "claws-governance-error" is acceptable
      (it is the @claws/ product name). "craftworks-sdk evaluation failed" is
      not. The error string templates used by the code generator must be
      audited.
    spec_impact: "CL-04 EMIT — error string internal reference audit"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      The generated SKILL.md is PRESS-compressed. PRESS is a Craftworks
      technology. The SKILL.md must not mention PRESS, compression, or
      Craftworks tooling. It should read as natural governance guidance that
      an OC developer wrote, not as "this was auto-generated by claws."
    spec_impact: "CL-04 EMIT — SKILL.md provenance invisibility"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      Comments in generated TypeScript are useful for debugging but may
      contain internal references. "// Generated by claws-sdk v1.0" is
      acceptable metadata. "// Uses compiler-sdk FormaIR pattern" is an
      internal reference leak. The comment policy for generated code must
      be defined.
    spec_impact: "CL-04 EMIT — generated code comment policy"
    pitfall: null

  - id: F05
    severity: note
    description: >
      This scenario is a post-emit validation pass, not a functional test.
      It should run as a CI check on every build: grep all generated
      artifacts for @craftworks/ and fail if any are found. The check is
      simple but critical for the adoption funnel.
    spec_impact: "CL-05 CI — @craftworks import scanner"
    pitfall: null

  - id: F06
    severity: major
    description: >
      If @claws/* packages depend on @craftworks/* packages transitively,
      the generated code's runtime dependencies include Craftworks code
      even though the import is @claws/*. The OC developer test should
      extend to runtime dependencies, not just source imports.
    spec_impact: "CL-04 EMIT — transitive dependency audit"
    pitfall: null

  - id: F07
    severity: warning
    description: >
      exec-approvals.json must use the OC platform's field names, not
      claws's internal field names. If claws uses "riskLevel" but OC
      expects "risk_level," the JSON is incompatible. A field name mapping
      layer in the emit phase handles this, but it must be correct per
      platform version.
    spec_impact: "CL-04 EMIT — platform field name mapping"
    pitfall: null

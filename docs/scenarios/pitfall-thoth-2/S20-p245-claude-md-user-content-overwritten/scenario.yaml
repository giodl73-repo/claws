name: S20-p245-claude-md-user-content-overwritten
series: pitfall-thoth-2
version: 1
specs: [CL-04, CL-05]
description: >
  Validates that the EMIT phase does not overwrite user-authored content in
  CLAUDE.md when emitting governance sections. The emitter must use delimiter-
  based section management to identify and update only the claws-managed section,
  preserving all user content above and below the delimiters intact.

expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed: [SOUL.md, TOOLS.md, claws.json]
    analysis:
      rules_evaluated: true
      emit_mode: section-merge
  violations: []
  warnings: []
  artifacts:
    count: 1

simulate:
  failures:
    - component: emit
      type: content-overwrite
      error: "CLAUDE.md user content destroyed — full file overwrite instead of section update"
    - component: emit
      type: delimiter-missing
      error: "No claws delimiters found — emitter wrote governance as entire file content"
  halt: null
  budget: null

problem: >
  A developer has a CLAUDE.md file with 200 lines of carefully crafted project
  instructions, coding conventions, and architectural decisions. They run claws
  compile for the first time to add governance enforcement. The EMIT phase writes
  the governance section to CLAUDE.md but uses a full-file-overwrite strategy
  instead of section insertion. The developer's 200 lines of project instructions
  are replaced with 15 lines of governance directives. The developer does not
  notice immediately because the file still exists and has content. A week later,
  a new team member reads CLAUDE.md and finds only governance rules, missing all
  the project context that was supposed to guide Claude's behavior. The original
  content is unrecoverable unless the developer has a recent backup.

findings:
  - id: F01
    severity: major
    description: >
      The EMIT phase must use well-defined delimiters to demarcate the
      claws-managed section within CLAUDE.md. The recommended format is:
      <!-- claws:governance:begin --> and <!-- claws:governance:end -->.
      HTML comments are invisible in rendered Markdown and survive most
      Markdown processors. All claws content must be written between
      these delimiters and nowhere else.
    spec_impact: "CL-04 EMIT — delimiter-based section management"
    pitfall: P-245

  - id: F02
    severity: major
    description: >
      On first compilation (no delimiters present), the emitter must
      APPEND the governance section with delimiters to the END of the
      existing CLAUDE.md content, never replace the file. If CLAUDE.md
      does not exist, the emitter creates it with only the delimited
      governance section. This append-on-first-run behavior preserves
      all existing content unconditionally.
    spec_impact: "CL-04 EMIT — append-on-first-run for CLAUDE.md"
    pitfall: P-245

  - id: F03
    severity: major
    description: >
      On subsequent compilations (delimiters present), the emitter must
      replace ONLY the content between the delimiters. Content above
      the begin delimiter and below the end delimiter must be preserved
      byte-for-byte. The emitter reads the file, identifies the
      delimiter positions, splices in the new governance content, and
      writes the complete file back.
    spec_impact: "CL-04 EMIT — delimiter-scoped content replacement"
    pitfall: P-245

  - id: F04
    severity: major
    description: >
      If the user accidentally deletes one delimiter but not the other,
      the emitter must detect the malformed delimiter state and refuse
      to modify the file. It should report an error: "CLAUDE.md has
      mismatched claws delimiters. Repair delimiters or use claws
      repair-delimiters to fix." Writing into a file with broken
      delimiters would corrupt user content.
    spec_impact: "CL-04 EMIT — malformed delimiter detection"
    pitfall: P-245

  - id: F05
    severity: major
    description: >
      The user may have placed content BETWEEN the delimiters manually
      (e.g., adding notes within the governance section). The emitter
      must overwrite the inter-delimiter content without warning because
      that section is explicitly claws-managed. However, the first line
      after the begin delimiter should include a comment: "This section
      is auto-generated by claws. Do not edit manually."
    spec_impact: "CL-04 EMIT — auto-generated section header comment"
    pitfall: P-245

  - id: F06
    severity: warning
    description: >
      Multiple CLAUDE.md files may exist in a project (root, nested
      directories). The emitter should only modify the CLAUDE.md
      specified in claws.json as the target, defaulting to the project
      root. Accidentally modifying a nested CLAUDE.md would inject
      governance into the wrong scope.
    spec_impact: "CL-04 EMIT — target CLAUDE.md path from claws.json"
    pitfall: P-245

  - id: F07
    severity: warning
    description: >
      The delimiter format must be stable across claws versions. If a
      future version changes the delimiter syntax, it must recognize
      both old and new formats during the transition period. Breaking
      delimiter compatibility would cause the emitter to treat old
      delimiters as user content and append a duplicate governance
      section.
    spec_impact: "CL-04 EMIT — backward-compatible delimiter recognition"
    pitfall: P-245

  - id: F08
    severity: warning
    description: >
      The CLAUDE.md content above the governance section may reference
      or depend on the governance rules (e.g., "See the governance
      section below for tool restrictions"). The emitter should not
      validate or modify user content references, but documentation
      should recommend placing the governance section at the end of
      CLAUDE.md to minimize reference breakage when rules change.
    spec_impact: "CL-05 DX — recommended CLAUDE.md section ordering"
    pitfall: P-245

  - id: F09
    severity: note
    description: >
      The claws eject command should remove the governance section
      cleanly by deleting everything between the delimiters (inclusive)
      and leaving the rest of CLAUDE.md intact. This enables clean
      uninstallation without manual delimiter removal.
    spec_impact: "CL-05 eject — clean delimiter removal from CLAUDE.md"
    pitfall: P-245

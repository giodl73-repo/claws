name: S02-badge-metadata-injection
series: package-output
version: 1
specs: [CL-05, CL-06, CL-07]
description: >
  During the publish pipeline, the artifact slicer injects badge tier metadata
  into the package.json of the output package. The badge tier (bronze, silver,
  gold, platinum) is determined by the governance analysis results: how many
  rules pass, which severity levels have violations, and whether all mandatory
  policies are satisfied. The injected metadata appears in a claws.badge field
  in package.json, enabling consumers to query governance quality without
  running their own analysis. This scenario validates that badge computation
  is correct, injection is non-destructive to existing package.json fields,
  and the badge is verifiable against the accompanying CGR.
expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed:
        - "SOUL.md"
        - "TOOLS.md"
        - "IDENTITY.md"
        - "claws.json"
    analysis:
      rules_evaluated: true
  violations: []
  warnings: []
  artifacts:
    count: 1
simulate:
  failures: []
  halt: null
  budget: null
problem: >
  A governance package author wants their published package to carry a
  quality badge that consumers can inspect before adopting the rules.
  The claws publish pipeline runs governance analysis, determines that
  all mandatory rules pass and no critical violations exist, computing
  a "gold" badge tier. The artifact slicer must inject this badge into
  package.json without overwriting existing fields (name, version,
  dependencies). The injected badge includes the tier, the analysis
  timestamp, and a hash linking back to the CGR. If the slicer
  overwrites existing package.json fields, the package becomes
  uninstallable. If the badge hash does not match the CGR, consumers
  cannot verify the badge's authenticity. The test confirms non-destructive
  injection with verifiable linkage to the compilation record.
findings:
  - id: F01
    severity: major
    description: >
      Badge tier computation must be deterministic given the same governance
      IR. If the tier algorithm uses floating-point percentages (e.g.,
      95.5% rules pass = gold), rounding differences across platforms
      could produce different tiers for the same input. The algorithm
      should use integer thresholds on rule counts (e.g., 0 critical
      violations AND >= 90% of rules pass) to ensure cross-platform
      reproducibility. The exact thresholds must be configurable in
      IDENTITY.md.
    spec_impact: "CL-06 Section 3 — badge tier determinism"
    pitfall: null
  - id: F02
    severity: major
    description: >
      The artifact slicer must perform a JSON-safe merge into package.json,
      not string concatenation or template injection. It must parse the
      existing package.json, add the claws.badge object, and serialize
      back with the original formatting (indent style, trailing newline).
      If the slicer changes indentation or key ordering, it creates
      unnecessary diffs in version control and may break tools that
      depend on specific JSON formatting.
    spec_impact: "CL-06 Section 4 — non-destructive JSON injection"
    pitfall: null
  - id: F03
    severity: major
    description: >
      The badge hash must be derived from the CGR content, not the badge
      tier string. A hash of "gold" is meaningless for verification. The
      badge should include a cgr_hash field that is the content hash of
      the full CGR at the time of badge computation. Consumers can then
      fetch the CGR and verify that its hash matches the badge's claim,
      establishing a trust chain from badge to compilation inputs.
    spec_impact: "CL-07 Section 18 — badge-to-CGR hash linkage"
    pitfall: null
  - id: F04
    severity: minor
    description: >
      Badge metadata should include the spec versions that defined the
      tier thresholds. If CL-06 Section 3 changes the gold threshold
      from 90% to 95%, existing gold badges computed under the old
      threshold are still valid under the old spec. Recording the
      spec version in the badge enables consumers to evaluate badges
      under the correct criteria.
    spec_impact: "CL-06 Section 5 — badge spec version recording"
    pitfall: null
  - id: F05
    severity: major
    description: >
      If the package.json does not exist (governance-only package without
      a Node.js project), the slicer must create one with required npm
      fields (name, version) derived from claws.json, plus the badge.
      Attempting to inject into a nonexistent file should not error
      silently or create an invalid package.json missing the name field.
      The created package.json must be a valid npm package descriptor.
    spec_impact: "CL-05 Section 5 — package.json creation fallback"
    pitfall: null
  - id: F06
    severity: minor
    description: >
      Badge injection should be idempotent. Running claws publish twice
      on the same source should produce the same badge in package.json,
      not nest a badge inside a badge or duplicate the claws.badge field.
      The slicer must overwrite the existing claws.badge if present,
      not append alongside it.
    spec_impact: "CL-06 Section 6 — idempotent badge injection"
    pitfall: null
  - id: F07
    severity: minor
    description: >
      The badge tier should be queryable via npm search metadata. If the
      claws.badge field is nested too deep or uses non-standard keys,
      npm search and registry UIs cannot surface it. Using the keywords
      field or a top-level claws key with flat structure maximizes
      discoverability across different registry implementations.
    spec_impact: "CL-05 Section 6 — registry discoverability"
    pitfall: null

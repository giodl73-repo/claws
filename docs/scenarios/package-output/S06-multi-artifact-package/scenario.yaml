name: S06-multi-artifact-package
series: package-output
version: 1
specs: [CL-05, CL-06, CL-07]
description: >
  A governance package contains multiple artifact types: policy rules, role
  definitions, and entity schemas. The publish pipeline must package all
  artifact types together with automatic dependency inclusion — if a policy
  rule references an entity by ID, that entity definition must be included
  in the package even if the entity file was not explicitly listed as a
  publish target. The artifact slicer determines the transitive closure of
  referenced artifacts and includes them all. This scenario validates
  multi-artifact packaging, dependency graph traversal, and the resulting
  package structure that consumers will resolve.
expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed:
        - "SOUL.md"
        - "TOOLS.md"
        - "MEMORY.md"
        - "AGENTS.md"
        - "claws.json"
    analysis:
      rules_evaluated: true
  violations: []
  warnings: []
  artifacts:
    count: 4
simulate:
  failures: []
  halt: null
  budget: null
problem: >
  A governance architect maintains a comprehensive package with 15 policy
  rules, 8 role definitions, and 12 entity schemas. Some rules reference
  entities (e.g., "data-classification-rule references entity:pii-data").
  Some roles reference rules they enforce. The architect runs claws publish
  targeting just the policies directory, expecting only policy rules in the
  package. However, the referenced entities must be auto-included or
  consumers will get unresolved references at compile time. The artifact
  slicer must build a dependency graph from rule->entity and role->rule
  references, compute the transitive closure, and include all reachable
  artifacts. If the slicer misses a transitive dependency, the published
  package compiles cleanly in isolation (all references resolve internally)
  but fails when merged with consumer rules that extend the entities.
  The package manifest must declare all included artifacts with their
  dependency relationships for consumer tooling to inspect.
findings:
  - id: F01
    severity: major
    description: >
      The dependency graph must handle cross-type references. Rules
      reference entities, roles reference rules, workflows reference
      gates. The slicer's graph must model all reference edge types,
      not just same-type references. A rule that references an entity
      which references another entity (transitive) must include both
      entities. Missing any edge type in the graph model means the
      transitive closure is incomplete and published packages will
      have dangling references.
    spec_impact: "CL-06 Section 14 — cross-type dependency graph"
    pitfall: null
  - id: F02
    severity: major
    description: >
      Cycle detection in the dependency graph is critical. If rule A
      references entity B which references rule A (through a "governed_by"
      back-reference), the slicer must detect the cycle and include both
      artifacts without entering an infinite traversal loop. Cycles are
      valid in governance models (mutual constraints) but must not cause
      the slicer to hang or crash.
    spec_impact: "CL-06 Section 15 — dependency cycle handling"
    pitfall: null
  - id: F03
    severity: major
    description: >
      The auto-inclusion behavior must be opt-out, not opt-in. By default,
      the slicer should include all transitive dependencies. A --no-auto-deps
      flag allows explicit control for cases where the author intentionally
      publishes partial packages (e.g., rule-only packages that declare
      entity dependencies as peer dependencies). Without opt-out, authors
      cannot create focused packages. Without default inclusion, most
      packages will be broken out of the box.
    spec_impact: "CL-05 Section 16 — auto-inclusion default behavior"
    pitfall: null
  - id: F04
    severity: minor
    description: >
      The package manifest should distinguish between directly included
      artifacts and transitively included artifacts. Consumers inspecting
      the manifest need to know which artifacts the author explicitly
      published vs which were pulled in by dependency resolution. This
      distinction helps consumers understand the package's intent and
      scope without reading every artifact.
    spec_impact: "CL-06 Section 16 — direct vs transitive manifest labels"
    pitfall: null
  - id: F05
    severity: major
    description: >
      Reference resolution during dependency graph construction must
      use the same identifier matching as the InputResolver's merge
      phase. If the slicer resolves "entity:pii-data" to entity file
      pii-data.yaml but the InputResolver resolves it to
      entities/pii-data.yaml, the slicer may include the wrong file
      or miss the reference entirely. A shared reference resolution
      function used by both slicer and resolver eliminates this class
      of divergence bugs.
    spec_impact: "CL-04 Section 19 — shared reference resolution logic"
    pitfall: null
  - id: F06
    severity: minor
    description: >
      Multi-artifact packages should include a dependency summary in
      their auto-generated documentation. The summary should list all
      artifact types, counts per type, and a simplified dependency
      graph (which rules use which entities). This helps consumers
      evaluate package scope before installation and understand the
      relationship structure without parsing the governance IR.
    spec_impact: "CL-06 Section 17 — dependency summary documentation"
    pitfall: null
  - id: F07
    severity: minor
    description: >
      The published package size should be bounded and warned against.
      If the transitive closure pulls in 500 artifacts for a package
      that explicitly targeted 5 rules, the author likely has an
      unexpected reference chain. A PUBLISH-LARGE-CLOSURE warning
      (triggered above a configurable threshold) alerts authors to
      review the dependency graph before publishing. The diagnostic
      should show the top expansion paths: which root artifacts
      caused the most transitive inclusions.
    spec_impact: "CL-05 Section 17 — closure size warning"
    pitfall: null

name: S01-publish-delegates-craft-package
series: package-output
version: 1
specs: [CL-05, CL-06, CL-07]
description: >
  The claws publish command delegates the actual packaging and registry upload
  to the craft package build and craft package publish subsystem. claws is
  responsible for compiling the governance IR and producing artifacts, but the
  packaging step (tarball creation, version stamping, registry authentication,
  upload) is owned by the craft package toolchain. This separation ensures
  claws remains a compiler while craft handles distribution mechanics. The
  scenario validates that claws correctly invokes craft package with the
  compiled artifacts and propagates success/failure status back to the user.
expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed:
        - "SOUL.md"
        - "TOOLS.md"
        - "MEMORY.md"
        - "claws.json"
    analysis:
      rules_evaluated: true
  violations: []
  warnings: []
  artifacts:
    count: 1
simulate:
  failures: []
  halt: null
  budget: null
problem: >
  A governance package author runs claws publish to distribute their
  compiled rules as an npm package. The command must first run a full
  compilation to produce the governance IR and artifacts, then invoke
  craft package build to create the distributable tarball, then invoke
  craft package publish to upload to the registry. If compilation fails,
  packaging must not be attempted. If packaging succeeds but publishing
  fails (e.g., auth error), the local tarball should remain for manual
  retry. The user sees a unified workflow (one command) but the internals
  delegate to two distinct systems. If claws tried to implement packaging
  itself, it would duplicate craft's registry logic and diverge over time.
  The delegation boundary must be clean: claws passes artifacts and
  metadata, craft handles everything else.
findings:
  - id: F01
    severity: major
    description: >
      The delegation interface between claws and craft package must be a
      stable contract, not an internal API call. If claws invokes craft
      as a subprocess, the interface is the CLI arguments and exit codes.
      If claws invokes craft as a library, the interface is a typed
      function signature. Either way, the contract must be versioned so
      that claws and craft can evolve independently. A breaking change
      in craft's packaging API should be detectable at claws's compile
      time, not at the user's runtime.
    spec_impact: "CL-05 Section 1 — delegation interface contract"
    pitfall: null
  - id: F02
    severity: major
    description: >
      Artifact handoff must use a well-defined directory structure, not
      ad-hoc file paths. claws should write compiled artifacts to a
      staging directory (e.g., .claws-out/publish/) with a manifest
      file listing all artifacts and their metadata. craft package build
      reads this manifest rather than globbing the directory. This
      prevents craft from accidentally including build intermediaries
      (temp files, partial IRs) in the published package.
    spec_impact: "CL-06 Section 1 — artifact staging manifest"
    pitfall: null
  - id: F03
    severity: major
    description: >
      Error propagation from craft back to claws must preserve structured
      diagnostics. If craft package publish fails with a 403 auth error,
      claws should surface the craft error with its original diagnostic
      code, not wrap it in a generic PUBLISH-FAILED message. Users need
      the craft-level error to troubleshoot registry authentication
      without knowing about the internal delegation boundary.
    spec_impact: "CL-05 Section 2 — error propagation fidelity"
    pitfall: null
  - id: F04
    severity: minor
    description: >
      The compilation step in claws publish should be skippable if a
      recent compilation output already exists. A --skip-compile flag
      that reuses the last .claws-out/ artifacts saves time when the
      developer has already verified the compilation and just wants
      to publish. The flag must validate that the artifacts are not
      stale by checking source file timestamps against artifact
      timestamps.
    spec_impact: "CL-05 Section 3 — skip-compile optimization"
    pitfall: null
  - id: F05
    severity: major
    description: >
      The craft package build step must validate that all required
      governance metadata is present before creating the tarball. A
      published package without a version field, without a name field,
      or without the governance IR would be unusable by consumers.
      Validation at the build step catches these errors before the
      upload attempt, avoiding orphaned versions in the registry.
    spec_impact: "CL-06 Section 2 — pre-publish metadata validation"
    pitfall: null
  - id: F06
    severity: minor
    description: >
      Dry-run mode (--dry-run) should execute compilation and packaging
      but skip the actual registry upload. This lets developers verify
      the full pipeline without side effects. The dry-run output should
      show exactly what would be published: package name, version,
      tarball size, file list, and target registry URL.
    spec_impact: "CL-05 Section 4 — dry-run publish preview"
    pitfall: null
  - id: F07
    severity: minor
    description: >
      The publish command should record the publication event in the CGR
      as an output provenance entry. This creates a bidirectional link:
      the CGR records which inputs produced the IR, and now also which
      registry and version the IR was published to. Audit tools can
      trace from a published package back to its exact compilation
      inputs through the CGR chain.
    spec_impact: "CL-07 Section 17 — publish provenance in CGR"
    pitfall: null

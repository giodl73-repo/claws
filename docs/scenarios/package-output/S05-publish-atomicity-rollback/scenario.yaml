name: S05-publish-atomicity-rollback
series: package-output
version: 1
specs: [CL-05, CL-06, CL-07]
description: >
  The publish pipeline fails midway through the upload to the npm registry
  (simulated network interruption after tarball creation but before registry
  confirmation). The scenario validates that no local state is mutated: the
  package.json version is not bumped, the .claws/publish-state is not updated,
  and no partial artifacts remain in the staging directory. The publish
  operation is atomic from the local filesystem perspective — either everything
  succeeds and local state reflects the publish, or everything rolls back
  to pre-publish state. This ensures developers can safely retry after
  failures without manual cleanup.
expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed:
        - "SOUL.md"
        - "TOOLS.md"
        - "claws.json"
    analysis:
      rules_evaluated: true
  violations: []
  warnings: []
  artifacts:
    count: 0
simulate:
  failures:
    - type: registry-upload-interrupted
      phase: upload
      diagnostic: PUBLISH-UPLOAD-INTERRUPTED
  halt: PUBLISH-UPLOAD-INTERRUPTED
  budget: null
problem: >
  A developer runs claws publish. Compilation succeeds, the tarball is
  created, the version is bumped in a staging copy of package.json, and
  the upload begins. Midway through the upload, the network drops. The
  registry did not receive the complete package. The developer's local
  state must be identical to before the publish attempt: package.json
  still has the old version, .claws/publish-state still references the
  previous publish hash, and the staging directory is cleaned up. If
  the version bump was written to the real package.json before upload
  confirmation, the developer now has a version that does not exist in
  the registry. Subsequent publishes may skip this version (thinking it
  was already published) or create gaps in the version history. The
  atomicity guarantee prevents this class of state corruption.
findings:
  - id: F01
    severity: major
    description: >
      The publish pipeline must use a two-phase commit for local state
      mutations. Phase 1: stage all changes (version bump, publish state,
      badge injection) to temporary files. Phase 2: after registry
      confirmation, atomically rename temporary files to their final
      locations. If the upload fails between phases, only temporary
      files exist and are cleaned up. This prevents the "committed
      locally but not remotely" state that causes version drift.
    spec_impact: "CL-05 Section 12 — two-phase local commit"
    pitfall: null
  - id: F02
    severity: major
    description: >
      The staging directory must be isolated from the workspace to prevent
      partial reads. If another tool (IDE, linter, watcher) reads the
      staging directory during publish, it may see incomplete artifacts.
      The staging directory should use a unique temporary path outside
      the workspace (e.g., OS temp directory with a UUID suffix) and
      only copy final artifacts back to the workspace upon success.
    spec_impact: "CL-06 Section 11 — staging directory isolation"
    pitfall: null
  - id: F03
    severity: major
    description: >
      Registry upload confirmation must be verified, not assumed from
      the absence of an error. Some registries return 200 before the
      package is fully indexed. The publish pipeline should verify
      the package exists in the registry (via a GET request to the
      package URL) before committing local state. A --skip-verify
      flag can bypass this for speed in trusted environments.
    spec_impact: "CL-05 Section 13 — upload verification"
    pitfall: null
  - id: F04
    severity: major
    description: >
      Cleanup of staging artifacts after failure must be reliable even
      if the cleanup itself fails. If a temporary file cannot be deleted
      (locked by another process on Windows), the pipeline must log
      the orphaned file path and continue rather than throwing a
      secondary error that masks the original upload failure. A
      periodic cleanup command (claws publish --cleanup) can sweep
      orphaned staging directories.
    spec_impact: "CL-06 Section 12 — failure-tolerant cleanup"
    pitfall: null
  - id: F05
    severity: minor
    description: >
      The rollback operation should emit a PUBLISH-ROLLED-BACK diagnostic
      with details of what was reverted: which files were staged, which
      temporary files were deleted, and the original error that triggered
      the rollback. This gives developers confidence that the rollback
      was complete and helps them diagnose the original failure.
    spec_impact: "CL-05 Section 14 — rollback diagnostic detail"
    pitfall: null
  - id: F06
    severity: minor
    description: >
      If the publish pipeline crashes (unhandled exception, OOM kill)
      rather than failing gracefully, orphaned staging state must be
      detectable on the next run. The pipeline should check for
      abandoned staging directories at startup and either clean them
      up automatically or prompt the developer to resolve them. Silent
      accumulation of orphaned staging directories wastes disk space
      and may confuse subsequent publish attempts.
    spec_impact: "CL-06 Section 13 — orphan detection on startup"
    pitfall: null
  - id: F07
    severity: minor
    description: >
      The atomicity guarantee should be documented as a user-facing
      contract, not just an implementation detail. Developers need to
      know that failed publishes are safe to retry without cleanup.
      The documentation should explicitly state: "claws publish is
      atomic with respect to local state. A failed publish leaves
      your workspace unchanged." This sets expectations and prevents
      developers from manually reverting files after a failure.
    spec_impact: "CL-05 Section 15 — atomicity as user contract"
    pitfall: null

name: S06-custom-governance-ontology
series: ontology-governance
version: 1
specs: [CL-04, CL-06, CL-07]
description: >
  Validates that an enterprise-authored custom governance ontology
  (not from a standard framework like SOC2 or HIPAA) compiles through
  the same pipeline as standard ontologies. A financial services firm
  defines trade-governance.onto.yaml with 4 custom controls covering
  trade execution approval, position limit enforcement, audit trail
  retention, and counterparty risk classification. The pipeline must
  treat custom ontologies identically to standard ones.

expect:
  rules_applied: [G-ELICIT, G-BOUND, G-PERM, G-CLASS]
  violations: []
  pass: true
  severity: null

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A financial services enterprise authors trade-governance.onto.yaml
  defining 4 domain-specific governance controls: (1) trade-approval
  requires human elicitation before any tool that executes trades --
  mapping to G-ELICIT with trade-specific approval prompts,
  (2) position-limits requires that tools exposing portfolio positions
  are bounded by configurable limits -- mapping to G-BOUND with
  numeric thresholds, (3) trade-audit requires 7-year audit trail
  retention for all trade-related tool invocations -- mapping to
  G-PERM with audit-retention metadata, (4) counterparty-risk requires
  risk classification of external API tools by counterparty identity --
  mapping to G-CLASS with a custom risk taxonomy. The compiler must
  parse this custom ontology using the same schema and pipeline as
  standard packages, with no special-casing for known frameworks.

findings:
  - id: F01
    severity: major
    description: >
      Custom ontologies may define G-rule mappings that standard
      ontologies do not use. trade-approval maps to G-ELICIT with
      custom approval prompts, but G-ELICIT's prompt template is
      defined in the spec with specific fields. If the custom
      ontology needs a prompt field that G-ELICIT does not support
      (e.g., trade_amount, counterparty_name), the ontology-to-rule
      mapping must support custom parameters that extend the base
      G-rule schema without modifying it.
    spec_impact: "CL-06 Ontology Mapping -- custom parameter extension for G-rule schemas"
    pitfall: null

  - id: F02
    severity: major
    description: >
      The custom risk taxonomy for counterparty-risk (G-CLASS) may
      conflict with the standard R1-R5 risk scale. If the financial
      firm uses a 3-tier taxonomy (low/medium/high) instead of R1-R5,
      the G-CLASS rule must either map the custom taxonomy to R1-R5
      or support alternative risk scales. Hardcoding R1-R5 in G-CLASS
      prevents custom taxonomies from working. The risk scale must be
      a configurable parameter of G-CLASS, not a built-in constant.
    spec_impact: "CL-02 G-CLASS -- configurable risk taxonomy (not hardcoded R1-R5)"
    pitfall: null

  - id: F03
    severity: major
    description: >
      Custom ontologies bypass the standard framework review process
      (SOC2 and HIPAA are reviewed by compliance standards bodies).
      A custom ontology with incorrect mappings (e.g., mapping a
      non-blocking concept to a blocking G-rule) could disrupt agent
      operations. The compiler should validate that custom ontology
      mappings are semantically consistent: a blocking G-rule (G-ELICIT)
      should only be mapped from a blocking control concept.
    spec_impact: "CL-04 Validation -- semantic consistency check for custom ontology mappings"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      The 7-year audit trail retention for trade-audit is a parameter
      that affects runtime infrastructure (log storage), not compile-time
      governance. The compiler can emit the retention requirement as
      metadata in GovernanceIR, but enforcing 7-year retention is an
      operational concern beyond claws's scope. The provenance must
      clearly mark which constraints are compile-time-enforceable and
      which are operational advisories.
    spec_impact: "CL-06 Provenance -- enforceable vs advisory constraint classification"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      Enterprise custom ontologies may evolve rapidly (weekly updates
      vs quarterly for SOC2). The ontology versioning system must
      handle high-frequency updates without creating excessive drift
      alerts. A configurable drift threshold (e.g., alert only when
      version is 3+ behind) prevents alert fatigue for rapidly
      evolving custom ontologies while maintaining strict version
      tracking for regulatory ontologies.
    spec_impact: "CL-07 Package Versioning -- configurable drift alert threshold per ontology"
    pitfall: null

  - id: F06
    severity: warning
    description: >
      Custom ontologies are not published to the public @openclaw
      package registry. They live in enterprise-internal registries
      or local filesystem paths. The compiler must resolve ontology
      packages from multiple sources: public registry, enterprise
      registry, and local paths. Package resolution order and conflict
      behavior when the same package name exists in multiple sources
      must be defined.
    spec_impact: "CL-07 Package Resolution -- multi-source registry with priority ordering"
    pitfall: null

  - id: F07
    severity: note
    description: >
      The scenario uses trade-governance as the custom ontology domain.
      The claws spec should include 2-3 example custom ontology schemas
      from different domains (financial, legal, healthcare-custom) to
      validate that the ontology schema is genuinely domain-agnostic.
      If all examples are compliance-focused, the schema may have
      compliance-specific assumptions that break for other domains
      (e.g., engineering quality, operational safety).
    spec_impact: "CL-06 Ontology Schema -- multi-domain example validation"
    pitfall: null

name: S04-p135-exec-approvals-field-mismatch
series: pitfall-final-2
version: 1
specs: [CL-02, CL-04]
description: >
  Validates that exec-approvals.json schema is pinned to the OC platform
  spec version (P-135). Using "deny" instead of "blocked" silently disables
  L4 governance because OC ignores unrecognized fields. Schema validation
  at emit time must catch field name mismatches.

expect:
  rules_applied: [G-EXEC-APPROVALS]
  violations:
    - code: CLAWS-E035
      rule: G-EXEC-APPROVALS
      description: "Field 'deny' not in OC exec-approvals schema — expected 'blocked'"
  pass: false
  severity: error

simulate:
  failures:
    - component: emit
      type: schema-field-mismatch
      error: "exec-approvals.json uses 'deny' field — OC platform expects 'blocked'"
  halt: emit
  budget: null

problem: >
  The emit phase generates exec-approvals.json with a "deny" field for
  tools that should be blocked. The OC platform schema expects "blocked"
  as the field name. OC silently ignores the unrecognized "deny" field,
  treating every tool as unblocked. L4 governance (platform-level tool
  blocking) is silently disabled for the entire workspace. The developer
  sees the generated exec-approvals.json, believes it is correct, and
  ships it to production.

findings:
  - id: F01
    severity: major
    description: >
      P-135 core: The OC platform's exec-approvals.json schema uses
      "blocked" as the field for denied tools. The emit phase generates
      "deny" (a reasonable synonym but not the correct field name). OC
      silently ignores unrecognized fields per its JSON parsing contract.
      Every tool in exec-approvals.json is effectively unblocked.
    spec_impact: "CL-04 EMIT — exec-approvals field name correctness"
    pitfall: "P-135"

  - id: F02
    severity: major
    description: >
      The emit phase must validate the generated exec-approvals.json
      against a pinned OC platform schema. The schema version must be
      declared in claws.json (e.g., ocPlatformVersion: "2024.1") and
      the corresponding JSON schema fetched from the schema registry.
      Any field not in the platform schema is a hard error.
    spec_impact: "CL-04 EMIT — schema validation against pinned OC spec"
    pitfall: "P-135"

  - id: F03
    severity: major
    description: >
      Schema drift: if the OC platform updates its schema (renaming
      "blocked" to "denied" in a future version), claws must detect
      the drift. The pinned schema version in claws.json ensures
      reproducible builds. Upgrading the platform version is an explicit
      action that triggers revalidation of all generated artifacts.
    spec_impact: "CL-01 schema — OC platform version pinning"
    pitfall: "P-135"

  - id: F04
    severity: major
    description: >
      Silent field ignoring is the most dangerous class of schema
      mismatch. Unlike a parse error (which is visible), a silently
      ignored field produces valid JSON that the platform accepts
      without error. The only signal is the absence of enforcement.
      Post-emit integration testing must verify that blocked tools
      are actually blocked at the platform level.
    spec_impact: "CL-04 EMIT — integration verification of enforcement"
    pitfall: "P-135"

  - id: F05
    severity: major
    description: >
      The exec-approvals.json schema has multiple field-name traps:
      "blocked" vs "deny" vs "denied" vs "disabled." The emit template
      must use the exact field names from the pinned schema, not
      semantic equivalents. Template literals should reference schema
      constants, not hardcoded strings.
    spec_impact: "CL-04 EMIT — template field name from schema constants"
    pitfall: "P-135"

  - id: F06
    severity: warning
    description: >
      `claws pinch` should include an exec-approvals schema check even
      for hand-authored exec-approvals.json files (not generated by claws).
      Workspaces that predate claws may have hand-written exec-approvals
      with incorrect field names. Pinch advisory CLAWS-W025 should warn.
    spec_impact: "CL-02 pinch — hand-authored exec-approvals validation"
    pitfall: "P-135"

  - id: F07
    severity: warning
    description: >
      Fleet impact: a schema mismatch in the emit template affects every
      workspace compiled with that version of claws. A bug in the template
      that uses "deny" instead of "blocked" would silently disable L4
      governance across the entire fleet. Template correctness is a
      fleet-wide safety property.
    spec_impact: "CL-05 fleet — template correctness as fleet safety"
    pitfall: "P-135"

  - id: F08
    severity: note
    description: >
      The OC platform should ideally reject unrecognized fields in
      exec-approvals.json (strict mode). But claws cannot control platform
      behavior. The defense must be on the claws side: validate output
      against the platform schema before it leaves the build pipeline.
    spec_impact: "CL-04 EMIT — defense-in-depth against lenient platform parsing"
    pitfall: "P-135"

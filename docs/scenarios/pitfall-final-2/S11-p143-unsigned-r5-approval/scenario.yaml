name: S11-p143-unsigned-r5-approval
series: pitfall-final-2
version: 1
specs: [CL-02]
description: >
  Validates that R5 elicitation approvals without HMAC signing are flagged
  as inadmissible (P-143). Six months after approval, an unsigned audit
  entry cannot be verified as authentic. Legal discovery cannot confirm
  the user actually approved the R5 tool execution.

expect:
  rules_applied: [G-ELICIT-AUDIT]
  violations:
    - code: OC-POLICY-E055
      rule: G-ELICIT-AUDIT
      description: "R5 elicitation approval recorded without HMAC — inadmissible in legal discovery"
  pass: false
  severity: error

simulate:
  failures:
    - component: audit-chain
      type: unsigned-approval
      error: "Elicitation approval for send-payment recorded without HMAC signature"
  halt: null
  budget: null

problem: >
  The elicitation gate fires for R5 tool send-payment. The user approves
  via inline chat. The approval is recorded in the audit chain but without
  HMAC signing because .claws/keys/ does not contain a signing key. Six
  months later, a legal discovery request asks for proof that the user
  authorized the $50,000 wire transfer. The audit entry shows approval
  but anyone with write access to the audit chain could have forged it.
  The entry is inadmissible as evidence.

findings:
  - id: F01
    severity: major
    description: >
      P-143 core: An audit entry without HMAC is indistinguishable from
      a forged entry. The integrity of the approval record depends entirely
      on access controls to the audit storage. In a shared environment,
      multiple agents and operators have write access. The unsigned entry
      proves nothing.
    spec_impact: "CL-02 G-ELICIT-AUDIT — unsigned approval inadmissibility"
    pitfall: "P-143"

  - id: F02
    severity: major
    description: >
      G-ELICIT must check for audit chain signing configuration at compile
      time. If signing is not configured and R5 tools exist in the workspace,
      the severity must scale: info for R1-R3 tools, warning for R4, error
      for R5. The error blocks compilation until signing is configured.
    spec_impact: "CL-02 G-ELICIT-AUDIT — risk-scaled signing requirement"
    pitfall: "P-143"

  - id: F03
    severity: major
    description: >
      The HMAC signing key must be generated by `claws init` and stored
      in .claws/keys/audit-signing.key. The key is workspace-specific.
      Each audit entry gets HMAC-SHA256(entry-json, signing-key) appended
      as a signature field. Verification requires the same key, which
      must be preserved for the retention period.
    spec_impact: "CL-05 init — audit signing key generation"
    pitfall: "P-143"

  - id: F04
    severity: major
    description: >
      Key rotation: when the signing key is rotated, old entries signed
      with the previous key must remain verifiable. The key rotation
      process must archive the old key with its validity period. The
      verification process checks the entry timestamp against key
      validity periods to select the correct key.
    spec_impact: "CL-02 G-ELICIT-AUDIT — key rotation with backward verification"
    pitfall: "P-143"

  - id: F05
    severity: major
    description: >
      The audit entry must include: user identity (who approved), timestamp
      (when), tool name and arguments (what), risk classification (why
      approval was required), and the HMAC signature. All fields are
      covered by the signature. Modifying any field invalidates the HMAC.
    spec_impact: "CL-02 G-ELICIT-AUDIT — signed audit entry schema"
    pitfall: "P-143"

  - id: F06
    severity: warning
    description: >
      The signing key itself must be protected. If an attacker can read
      .claws/keys/audit-signing.key, they can forge entries. File system
      permissions (600) and .gitignore rules must protect the key.
      `claws init` must set restrictive permissions and add the key
      path to .gitignore.
    spec_impact: "CL-05 init — signing key protection"
    pitfall: "P-143"

  - id: F07
    severity: warning
    description: >
      Fleet-wide signing: in a fleet, each workspace has its own signing
      key. A central audit aggregator must have access to all workspace
      keys for verification. Key distribution is a fleet management
      concern. `claws fleet` should support key escrow or centralized
      signing.
    spec_impact: "CL-05 fleet — audit key distribution"
    pitfall: "P-143"

  - id: F08
    severity: note
    description: >
      HMAC provides integrity and authenticity against external tampering.
      It does not provide non-repudiation (the user could claim the system
      auto-approved without their consent). Full non-repudiation requires
      a challenge-response protocol for R5 approvals, which is a CL-07
      deep integration concern.
    spec_impact: "CL-07 — R5 approval non-repudiation"
    pitfall: "P-143"

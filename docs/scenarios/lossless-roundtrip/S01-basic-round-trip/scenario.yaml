name: S01-basic-round-trip
series: lossless-roundtrip
version: 1
specs: [CL-04]
description: >
  Validates the fundamental lossless guarantee: compile a workspace containing
  all 9 source files, then verify that every original file is byte-for-byte
  identical after compilation. The emit phase writes to skills/, plugins/,
  exec-approvals.json, and lobster.compiled.yaml — NEVER to SOUL.md, TOOLS.md,
  AGENTS.md, IDENTITY.md, USER.md, MEMORY.md, HEARTBEAT.md, skills/*/SKILL.md
  (source), or lobster.yaml (source).

expect:
  governance_ir:
    version: 1
    manifest:
      files_parsed: [SOUL.md, TOOLS.md, AGENTS.md, IDENTITY.md, USER.md, MEMORY.md, HEARTBEAT.md, skills/, lobster.yaml]
  violations: []
  warnings: []
  artifacts:
    count: 4
    paths:
      - skills/claws-governance/SKILL.md
      - plugins/claws-governance/index.ts
      - exec-approvals.json
      - lobster.compiled.yaml

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A workspace contains all 9 OC files with valid content: SOUL.md with deny
  constraints, TOOLS.md with R1-R5 tools, AGENTS.md with subagent delegation,
  IDENTITY.md with L2 identity, USER.md with OBO grants, MEMORY.md with data
  labels, HEARTBEAT.md with schedules, skills/ with one user-authored skill,
  and lobster.yaml with a workflow. Run `claws build` and verify: (1) all 9
  source files have identical SHA-256 hashes before and after compilation, (2)
  the 4 output artifacts are written to their designated paths, and (3) no
  source file has a modified timestamp.

findings:
  - id: F01
    severity: major
    description: >
      The lossless guarantee must be enforced at the emit phase implementation
      level, not just by convention. The emit phase must have a write-allow-
      list of output paths (skills/claws-governance/, plugins/claws-governance/,
      exec-approvals.json, lobster.compiled.yaml, .claws/). Any write to a
      path not on the allow-list is a lossless violation. A code bug that
      writes to SOUL.md instead of SKILL.md silently breaks the guarantee.
    spec_impact: "CL-04 EMIT — write-allow-list enforcement mechanism"
    pitfall: null

  - id: F02
    severity: major
    description: >
      The user-authored skills/ directory contains source SKILL.md files
      that must not be modified. The emit phase writes to
      skills/claws-governance/SKILL.md (the generated advisory skill).
      If the emit path resolution is relative and the skill name collides
      with a user-authored skill directory, the emit overwrites user content.
      The generated skill directory name (claws-governance) must be reserved
      and collision-checked against existing skill directories.
    spec_impact: "CL-04 EMIT — reserved directory name for generated governance skill"
    pitfall: P-230

  - id: F03
    severity: warning
    description: >
      File timestamp preservation matters for build tools that use mtime for
      change detection (make, webpack, etc.). Even if file content is
      unchanged, opening a file for read-then-write would update the mtime
      on some operating systems. The pipeline must use read-only file
      handles for source files. On Windows, opening a file with write
      access updates the last-access time even if no write occurs.
    spec_impact: "CL-04 PARSE — read-only file handle requirement for source files"
    pitfall: null

  - id: F04
    severity: major
    description: >
      exec-approvals.json is the one output artifact that modifies an
      existing host-level file (not in a claws-owned directory). CL-04
      specifies mixed create/overwrite atomicity (SCV-S01-F07) for this
      case. If exec-approvals.json already exists with manually-edited
      content, the emit phase overwrites it. The lossless guarantee applies
      to the 9 source files, not to exec-approvals.json. But the developer
      may not realize exec-approvals.json is compiler-managed. A comment
      header in the generated file ("// Generated by claws — do not edit")
      would clarify ownership.
    spec_impact: "CL-04 EMIT — ownership comment header in generated exec-approvals.json"
    pitfall: null

  - id: F05
    severity: warning
    description: >
      The lobster.yaml source file must not be modified, but
      lobster.compiled.yaml is generated output. The naming convention
      (.compiled suffix) distinguishes source from output. If a developer
      renames lobster.compiled.yaml to lobster.yaml (removing the suffix),
      the next compilation reads the compiled version as source, creating
      a feedback loop where governance injection compounds. The parser
      must detect and reject compiled workflows as source input.
    spec_impact: "CL-04 PARSE — compiled workflow detection to prevent feedback loops"
    pitfall: P-231

  - id: F06
    severity: warning
    description: >
      The SHA-256 hash verification for lossless round-trip must hash the
      raw file bytes, not the parsed content. If the parser normalizes
      content internally (strip BOM, normalize line endings, trim trailing
      whitespace), the normalized content hash would differ from the raw
      file hash even though the file was never modified. Raw-byte hashing
      is the only valid lossless proof.
    spec_impact: "CL-04 lossless verification — raw-byte SHA-256, not parsed-content hash"
    pitfall: null

  - id: F07
    severity: note
    description: >
      The 4 output artifacts are all in well-defined locations. But
      .claws/ also receives compiled data (governance-ir.json, compiled
      tables, cache). These .claws/ writes are internal pipeline state,
      not workspace files, so they do not violate lossless guarantees.
      The boundary is: workspace files (lossless) vs .claws/ pipeline
      state (mutable). This distinction must be documented.
    spec_impact: "CL-04 lossless boundary — workspace files vs .claws/ pipeline state"
    pitfall: null

  - id: F08
    severity: major
    description: >
      If the workspace is inside a git repository, the lossless guarantee
      can be verified post-build via `git diff`. If any of the 9 source
      files show as modified after `claws build`, the lossless guarantee
      is broken. This suggests a natural integration test: run
      `claws build` in a clean git worktree and assert `git diff --stat`
      on source files returns empty.
    spec_impact: "CL-04 testing strategy — git-diff-based lossless integration test"
    pitfall: null

  - id: F09
    severity: note
    description: >
      The 9 source files are workspace files defined by the OC platform.
      If the OC platform adds a 10th file type in a future version, claws
      must add it to both the parse list and the lossless protection list.
      The lossless protection must be derived from the parse list, not
      maintained as a separate list that could drift.
    spec_impact: "CL-04 lossless enforcement — derived from parse file list, not separate configuration"
    pitfall: null

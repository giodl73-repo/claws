name: S05-publish-unsigned-manifest
series: skill-lifecycle
version: 1
specs: [CL-05]
description: >
  Validates that attempting `claws publish` without a signed .claws-manifest
  produces a warning or block depending on workspace policy. The publish
  command wraps `clawhub publish` and adds governance metadata, supply chain
  signing, and badge computation. An unsigned skill can still be published
  but receives a degraded badge.

expect:
  artifacts:
    - type: publish-attempt
      signed: false
      blocked: false
  plugin_hooks: null
  skill_content:
    tier: DECLARED
    supply_chain: unsigned
    badge_degraded: true
  approvals: null

simulate:
  failures: []
  halt: null
  budget: null

problem: >
  A developer at DECLARED tier (frontmatter only, no build) runs
  `claws publish`. The skill has valid governance frontmatter but no
  .claws-manifest (which is generated by `claws build --skill` at VERIFIED
  tier). The publish command must: (1) warn that the skill is unsigned,
  (2) allow publication by default (not block DECLARED-tier publishing),
  (3) set badge supply_chain to "unsigned", and (4) suggest running
  `claws build --skill` to reach VERIFIED tier before publishing.

findings:
  - id: F01
    severity: major
    description: >
      The publish command must distinguish between "no manifest because never
      built" (DECLARED tier) and "manifest present but signature invalid"
      (VERIFIED tier with tampered manifest). The first case is a known
      governance gap (warn, allow publish). The second is a supply chain
      integrity failure (block publish, require rebuild). Same missing-
      signature symptom, different severity and remediation.
    spec_impact: "CL-05 Maker Experience — publish distinguishes unsigned from invalid-signed"
    pitfall: null

  - id: F02
    severity: major
    description: >
      Enterprise fleet policies may require VERIFIED tier for publication.
      If the workspace's claws.json includes `fleet.requireVerifiedPublish:
      true`, the publish command must block DECLARED-tier publishing
      entirely. The default behavior (warn, allow) is overridden by fleet
      policy. CL-05 does not specify this fleet policy field.
    spec_impact: "CL-05 Maker Experience — fleet-level publish tier requirement"
    pitfall: null

  - id: F03
    severity: warning
    description: >
      The `claws publish` warning message must follow the error message
      contract: WHAT (skill is unsigned), HOW (run `claws build --skill`
      to sign), WHERE (docs URL). The warning must appear prominently in
      the publish output, not buried in verbose logs. If the developer
      publishes with `--quiet`, the warning must still be shown (not
      suppressed by quiet mode) because it affects consumer trust.
    spec_impact: "CL-05 Error Message Contract — warnings not suppressible by --quiet for security-relevant messages"
    pitfall: null

  - id: F04
    severity: warning
    description: >
      The .claws-manifest signature uses a key. Where does the signing key
      come from? Options: (1) fleet-managed key in .claws/keys/, (2) developer
      identity key from `claws identity`, (3) CI/CD signing key from
      environment variable. CL-05 does not specify the key source for
      manifest signing. Without a defined key management path, VERIFIED
      tier is unachievable.
    spec_impact: "CL-05 Maker Experience — manifest signing key source and key management"
    pitfall: null

  - id: F05
    severity: major
    description: >
      If `claws publish` calls `clawhub publish` under the hood, the
      two-step operation is non-atomic. If badge metadata injection succeeds
      but clawhub publish fails (network error, auth failure), the skill
      is not published but local state may reflect a publish attempt. The
      publish command must not mutate local state (e.g., incrementing version
      numbers) until the remote publish confirms success.
    spec_impact: "CL-05 Maker Experience — publish atomicity and rollback on remote failure"
    pitfall: P-228

  - id: F06
    severity: warning
    description: >
      The badge metadata injected by `claws publish` includes risk, obo,
      data, tier, and supply_chain fields. These fields must be read from
      the current SKILL.md frontmatter at publish time, not from a cached
      build artifact. If the developer modifies frontmatter after building
      but before publishing, the badge must reflect the current frontmatter,
      not the stale build. This creates a freshness race.
    spec_impact: "CL-05 ClawHub Governance Badges — badge freshness at publish time"
    pitfall: null

  - id: F07
    severity: note
    description: >
      `claws publish` must validate that the governance frontmatter is still
      valid before publishing. A developer might have valid frontmatter,
      break it with an edit, and then publish. The publish step should run
      the equivalent of `claws pinch` validation before proceeding. This
      prevents publishing skills with governance errors.
    spec_impact: "CL-05 Maker Experience — implicit pinch validation before publish"
    pitfall: null

  - id: F08
    severity: major
    description: >
      Skills published without `claws publish` (via raw `clawhub publish`)
      have no governance badge at all. ClawHub must render these skills
      without a badge, not with a "unknown" or "error" badge. The absence
      of a badge is meaningful: it means the skill was never submitted to
      governance analysis. CL-05 asks how ClawHub should render this case
      (open question 5) but the scenario exposes that the rendering must
      be designed.
    spec_impact: "CL-05 Open Question 5 — ClawHub rendering for skills published without claws"
    pitfall: null

  - id: F09
    severity: warning
    description: >
      Version handling across publish cycles: if a skill is published at
      v1.0.0 with DECLARED badge and later republished at v1.1.0 with
      VERIFIED badge, both versions exist on ClawHub. Badge queries must
      be version-specific. A consumer installing v1.0.0 must see the
      DECLARED badge, not the VERIFIED badge from v1.1.0.
    spec_impact: "CL-05 ClawHub Governance Badges — per-version badge storage"
    pitfall: null

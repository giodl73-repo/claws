name: S16-p177-kill-disable-vs-halt
series: pitfall-anubis
version: 1
specs: [CL-05, CL-02]
description: >
  Validates that the kill switch implements deny-all semantics (agents halted)
  rather than disable-governance semantics (agents run ungoverned). A kill
  switch that disables governance while leaving agents running turns a security
  incident into a catastrophe.

expect:
  workspaces:
    total: 5
    killed: 5
    active: 0
    agents_running_ungoverned: 0
  drift_count: 0
  broadcast_result: null
  compliance:
    governance_active: 0
    governance_halted: 5
    agents_halted: 5
    agents_ungoverned: 0

simulate:
  failures:
    - component: kill-switch
      type: disable-not-halt
      error: "Kill disabled governance but agents continued running without governance enforcement"
  halt:
    type: fleet-kill
    reason: "compromised agent detected in workspace-gamma"
    timestamp: "2026-04-11T16:00:00Z"
  budget: null

problem: >
  A security team detects a compromised agent in workspace-gamma that is
  exfiltrating data via the file_write tool. The incident responder runs
  `claws kill --fleet --confirm`. The kill switch removes the governance
  plugin from all workspaces. However, the agents themselves continue
  running. Without governance, the compromised agent now has unrestricted
  access to all tools — the kill switch removed the only barrier that was
  partially containing the breach. The R5 fail-closed tool calls that
  governance was blocking are now unprotected. The kill switch made the
  incident worse, not better.

findings:
  - id: F01
    severity: major
    description: >
      CL-05 must define kill switch semantics as deny-all, not disable-governance.
      When kill is activated, the governance plugin must switch to a mode that
      denies ALL tool calls unconditionally. The plugin remains loaded but
      returns DENY for every request. This is fundamentally different from
      unloading the plugin, which leaves agents ungoverned. The distinction
      must be explicit in the spec.
    spec_impact: "CL-05 Kill Switch — deny-all semantics definition"
    pitfall: P-177

  - id: F02
    severity: major
    description: >
      The kill state must be tamper-resistant. A compromised agent that detects
      the kill might attempt to modify the kill flag or restart the governance
      plugin in a permissive mode. The kill state should be enforced at the
      platform level (process signal, file system permission) rather than
      relying on a configuration flag that the agent process can modify.
    spec_impact: "CL-05 Kill Switch — tamper-resistant kill state"
    pitfall: P-177

  - id: F03
    severity: major
    description: >
      The audit trail for kill must record the exact semantics applied. The
      audit event must distinguish between "deny-all activated" and "governance
      unloaded." If an implementation accidentally uses disable instead of
      deny-all, the audit trail is the forensic evidence that reveals the gap.
      The audit event should include: kill_type (deny-all | disable), agents_halted
      count, and tools_blocked count.
    spec_impact: "CL-05 Kill Switch — audit event kill_type field"
    pitfall: P-177

  - id: F04
    severity: major
    description: >
      Recovery from kill (claws unkill) must re-enable governance with full
      enforcement before allowing any agent tool calls. There must be no
      window between unkill and governance resumption where agents run
      ungoverned. The unkill sequence must be: (1) load governance IR, (2)
      register all hooks, (3) verify hook registration, (4) switch from
      deny-all to enforce mode. Steps 1-3 happen while deny-all is still
      active.
    spec_impact: "CL-05 Kill Switch — zero-gap unkill sequence"
    pitfall: P-177

  - id: F05
    severity: major
    description: >
      Platform-specific kill implementation matters. On Claude Code, kill must
      signal the governance plugin to enter deny-all mode. On Cursor, kill
      must interact with the extension host. On CrewAI, kill must pause the
      crew execution loop. CL-05 must define the abstract semantics (deny-all)
      and each platform adapter must implement it. Platform kill tests must
      verify agents cannot execute tools post-kill.
    spec_impact: "CL-05 Kill Switch — platform-specific implementation requirements"
    pitfall: P-177

  - id: F06
    severity: warning
    description: >
      The kill switch should support partial kill: `claws kill --workspace gamma`
      to kill only the compromised workspace while others continue operating.
      Fleet-wide kill is a blunt instrument. Partial kill contains the incident
      to the affected workspace without disrupting the entire fleet. Partial
      kill must still use deny-all semantics for the targeted workspace.
    spec_impact: "CL-05 Kill Switch — partial kill per workspace"
    pitfall: P-177

  - id: F07
    severity: warning
    description: >
      The difference between kill (deny-all) and disable (remove governance)
      must be prominently documented in the CLI help text, the getting-started
      guide, and the incident response runbook. Operators who confuse the two
      may choose disable when they need kill, with catastrophic results. The
      CLI should not even offer a disable option — only kill (deny-all) and
      unkill (resume enforcement).
    spec_impact: "CL-01 CLI Surface — no disable command, only kill/unkill"
    pitfall: P-177

  - id: F08
    severity: note
    description: >
      Testing kill semantics requires a scenario where a tool call is in
      progress when kill activates. The in-flight tool call must either
      complete (with governance already applied at call start) or be
      interrupted. CL-05 should specify that kill takes effect on the next
      tool call boundary, not mid-execution. This prevents undefined behavior
      from interrupting a partially-executed tool.
    spec_impact: "CL-05 Kill Switch — tool call boundary semantics"
    pitfall: P-177
